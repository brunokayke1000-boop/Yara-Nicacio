<!DOCTYPE html>
<html lang="pt-BR">

<head>

  >

  <meta name="theme-color" content="#050505">

  <title>Trabalhos | Yara Nicácio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      background:#050505;
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      min-height:100vh;
      overflow-x:hidden;
      color:#fff;

      font-family:
        'Montserrat',
        sans-serif;

      background:
        radial-gradient(
          circle at 90% 12%,
          rgba(188,139,55,.12),
          transparent 28%
        ),
        radial-gradient(
          circle at 5% 68%,
          rgba(125,82,25,.08),
          transparent 28%
        ),
        linear-gradient(
          180deg,
          #050505 0%,
          #090704 48%,
          #050505 100%
        );
    }


    /* ========================================
       ATMOSFERA
    ======================================== */

    .ambient{
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      overflow:hidden;
    }

    .ambient::before{
      content:"";
      position:absolute;

      width:360px;
      height:360px;

      top:40px;
      right:-220px;

      border-radius:50%;

      background:
        rgba(198,148,62,.10);

      filter:blur(110px);
    }

    .ambient::after{
      content:"";
      position:absolute;

      width:300px;
      height:300px;

      left:-190px;
      bottom:5%;

      border-radius:50%;

      background:
        rgba(145,94,31,.08);

      filter:blur(105px);
    }


    /* ========================================
       CABEÇALHO
    ======================================== */

    .topbar{
      position:relative;
      z-index:10;

      width:100%;

      min-height:105px;

      padding:
        max(
          22px,
          env(safe-area-inset-top)
        )
        20px
        10px;

      display:flex;
      align-items:center;
      justify-content:space-between;
    }


    /* ========================================
       VOLTAR
    ======================================== */

    .back-button{
      width:55px;
      height:55px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:50%;

      border:
        1px solid
        rgba(211,164,84,.50);

      background:
        rgba(7,7,7,.58);

      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);

      box-shadow:
        0 8px 22px
        rgba(0,0,0,.45),

        0 0 18px
        rgba(211,164,84,.07);

      text-decoration:none;

      -webkit-tap-highlight-color:
        transparent;

      transition:
        transform .25s ease,
        border-color .25s ease;
    }

    .back-button:active{
      transform:scale(.93);
    }

    .back-arrow{
      width:17px;
      height:17px;

      border-left:
        1.5px solid
        #d5aa66;

      border-bottom:
        1.5px solid
        #d5aa66;

      transform:rotate(45deg);

      margin-left:6px;
    }


    /* ========================================
       LOGO
    ======================================== */

    .top-logo{
      width:120px;
      height:auto;

      object-fit:contain;

      filter:
        drop-shadow(
          0 5px 12px
          rgba(0,0,0,.72)
        )
        drop-shadow(
          0 0 7px
          rgba(207,159,67,.14)
        );
    }


    /* ========================================
       INTRODUÇÃO
    ======================================== */

    .intro{
      position:relative;
      z-index:3;

      padding:
        38px
        22px
        14px;
    }

    .eyebrow{
      display:flex;
      align-items:center;
      gap:13px;

      margin-bottom:13px;

      color:
        rgba(211,165,88,.82);

      font-size:9px;
      font-weight:400;

      letter-spacing:.40em;

      text-transform:uppercase;
    }

    .eyebrow::before{
      content:"";

      width:36px;
      height:1px;

      background:
        linear-gradient(
          90deg,
          rgba(211,165,88,.10),
          rgba(211,165,88,.90)
        );
    }

    .intro h1{
      margin:0;

      font-family:
        'Cormorant Garamond',
        Georgia,
        serif;

      font-size:
        clamp(
          55px,
          15vw,
          90px
        );

      line-height:.90;

      font-weight:400;

      letter-spacing:-.035em;

      color:#f3eee7;

      text-shadow:
        0 9px 24px
        rgba(0,0,0,.50);
    }

    .intro-text{
      margin-top:22px;

      max-width:560px;

      font-family:
        'Cormorant Garamond',
        Georgia,
        serif;

      font-size:
        clamp(
          19px,
          4.9vw,
          25px
        );

      font-weight:400;

      line-height:1.35;

      color:
        rgba(238,229,216,.69);
    }


    /* ========================================
       DESLIZE
    ======================================== */

    .drag-hint{
      position:relative;
      z-index:3;

      padding:
        27px
        22px
        17px;

      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .drag-text{
      color:
        rgba(255,255,255,.37);

      font-size:8px;

      letter-spacing:.37em;

      text-transform:uppercase;
    }

    .drag-arrow{
      display:flex;
      align-items:center;
      gap:6px;

      animation:
        dragMove
        2s
        ease-in-out
        infinite;
    }

    .drag-line{
      width:45px;
      height:1px;

      background:
        linear-gradient(
          90deg,
          rgba(205,159,81,.08),
          rgba(218,175,100,.90)
        );
    }

    .drag-chevron{
      width:8px;
      height:8px;

      border-top:
        1px solid
        rgba(218,175,100,.90);

      border-right:
        1px solid
        rgba(218,175,100,.90);

      transform:rotate(45deg);
    }

    @keyframes dragMove{

      0%,
      100%{
        transform:
          translateX(0);

        opacity:.55;
      }

      50%{
        transform:
          translateX(8px);

        opacity:1;
      }

    }


    /* ========================================
       GALERIA
    ======================================== */

    .portfolio{
      position:relative;
      z-index:3;

      width:100%;

      padding-bottom:25px;
    }

    .portfolio-track{
      width:100%;

      display:flex;

      gap:15px;

      overflow-x:auto;
      overflow-y:hidden;

      scroll-snap-type:
        x mandatory;

      scroll-padding-left:22px;

      padding:
        5px
        22px
        27px;

      scrollbar-width:none;

      -ms-overflow-style:none;

      -webkit-overflow-scrolling:
        touch;

      overscroll-behavior-x:
        contain;
    }

    .portfolio-track::-webkit-scrollbar{
      display:none;
    }


    /* ========================================
       CARDS
    ======================================== */

    .work-card{
      position:relative;

      flex:
        0 0
        min(
          79vw,
          430px
        );

      aspect-ratio:
        4 / 5;

      overflow:hidden;

      scroll-snap-align:start;

      border-radius:6px;

      background:#0b0907;

      border:
        1px solid
        rgba(208,160,80,.18);

      box-shadow:
        0 20px 45px
        rgba(0,0,0,.48),

        0 0 0 1px
        rgba(255,255,255,.012);
    }

    .work-card img{
      position:absolute;

      inset:0;

      width:100%;
      height:100%;

      object-fit:cover;

      transform:scale(1.002);

      transition:
        transform .7s
        cubic-bezier(.2,.75,.25,1);
    }

    .work-card:active img{
      transform:scale(1.025);
    }

    .work-card::before{
      content:"";

      position:absolute;
      inset:0;

      z-index:2;

      pointer-events:none;

      background:
        linear-gradient(
          to top,
          rgba(0,0,0,.57) 0%,
          rgba(0,0,0,.12) 27%,
          rgba(0,0,0,0) 58%
        );
    }

    .work-card::after{
      content:"";

      position:absolute;
      inset:0;

      z-index:3;

      pointer-events:none;

      border:
        1px solid
        rgba(255,255,255,.025);

      border-radius:6px;
    }


    /* ========================================
       NUMERAÇÃO
    ======================================== */

    .work-number{
      position:absolute;

      left:17px;
      bottom:16px;

      z-index:5;

      font-family:
        'Cormorant Garamond',
        Georgia,
        serif;

      font-size:15px;

      letter-spacing:.14em;

      color:
        rgba(231,196,132,.83);

      text-shadow:
        0 3px 8px
        rgba(0,0,0,.75);
    }

    .work-detail{
      position:absolute;

      right:16px;
      bottom:20px;

      z-index:5;

      width:36px;
      height:1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(220,178,99,.88)
        );
    }


    /* ========================================
       CONTADOR
    ======================================== */

    .gallery-footer{
      position:relative;
      z-index:3;

      padding:
        4px
        22px
        55px;

      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .counter{
      display:flex;

      align-items:baseline;

      gap:7px;

      font-family:
        'Cormorant Garamond',
        Georgia,
        serif;
    }

    .counter-current{
      font-size:30px;

      color:#e8d9be;
    }

    .counter-total{
      font-size:15px;

      color:
        rgba(255,255,255,.30);
    }

    .footer-line{
      flex:1;

      height:1px;

      margin-left:20px;

      background:
        linear-gradient(
          90deg,
          rgba(203,157,80,.48),
          rgba(203,157,80,0)
        );
    }


    /* ========================================
       FINAL
    ======================================== */

    .closing{
      position:relative;
      z-index:3;

      min-height:38vh;

      padding:
        45px
        26px
        125px;

      display:flex;

      flex-direction:column;

      align-items:center;
      justify-content:center;

      text-align:center;
    }

    .closing-line{
      width:1px;
      height:60px;

      margin-bottom:28px;

      background:
        linear-gradient(
          to bottom,
          rgba(213,168,92,.04),
          rgba(213,168,92,.72),
          rgba(213,168,92,.04)
        );
    }

    .closing p{
      max-width:550px;

      font-family:
        'Cormorant Garamond',
        Georgia,
        serif;

      font-size:
        clamp(
          25px,
          7vw,
          39px
        );

      font-weight:400;

      line-height:1.16;

      color:
        rgba(242,234,222,.91);
    }

    .closing span{
      display:block;

      margin-top:17px;

      color:
        rgba(203,157,82,.67);

      font-size:8px;

      letter-spacing:.38em;

      text-transform:uppercase;
    }


    /* ========================================
       WHATSAPP
    ======================================== */

    .whatsapp-button{
      position:fixed;

      right:18px;

      bottom:
        max(
          22px,
          calc(
            env(safe-area-inset-bottom)
            + 16px
          )
        );

      width:72px;
      height:72px;

      z-index:100;

      display:flex;

      align-items:center;
      justify-content:center;

      border-radius:50%;

      text-decoration:none;

      animation:
        whatsappPulse
        3s
        ease-in-out
        infinite;

      -webkit-tap-highlight-color:
        transparent;
    }

    .whatsapp-button::before,
    .whatsapp-button::after{
      content:"";

      position:absolute;

      border-radius:50%;

      pointer-events:none;
    }

    .whatsapp-button::before{
      inset:-7px;

      border:
        1px solid
        rgba(214,167,73,.30);

      animation:
        whatsappRing
        3s
        ease-in-out
        infinite;
    }

    .whatsapp-button::after{
      inset:-15px;

      border:
        1px solid
        rgba(214,167,73,.11);

      animation:
        whatsappRingOuter
        3s
        ease-in-out
        infinite;
    }

    .whatsapp-button img{
      position:relative;

      z-index:2;

      width:100%;
      height:100%;

      object-fit:contain;

      filter:
        drop-shadow(
          0 5px 10px
          rgba(0,0,0,.85)
        )

        drop-shadow(
          0 0 7px
          rgba(214,167,73,.18)
        );
    }

    @keyframes whatsappPulse{

      0%,
      100%{
        transform:scale(1);
      }

      50%{
        transform:scale(1.075);
      }

    }

    @keyframes whatsappRing{

      0%,
      100%{
        opacity:.28;
        transform:scale(.94);
      }

      50%{
        opacity:.65;
        transform:scale(1.08);
      }

    }

    @keyframes whatsappRingOuter{

      0%,
      100%{
        opacity:.10;
        transform:scale(.92);
      }

      50%{
        opacity:.35;
        transform:scale(1.10);
      }

    }


    /* ========================================
       RESPONSIVO
    ======================================== */

    @media(max-width:390px){

      .top-logo{
        width:108px;
      }

      .back-button{
        width:52px;
        height:52px;
      }

      .intro{
        padding-left:19px;
        padding-right:19px;
      }

      .drag-hint{
        padding-left:19px;
        padding-right:19px;
      }

      .portfolio-track{
        padding-left:19px;
        padding-right:19px;

        scroll-padding-left:19px;
      }

      .work-card{
        flex-basis:80vw;
      }

      .gallery-footer{
        padding-left:19px;
        padding-right:19px;
      }

      .whatsapp-button{
        width:68px;
        height:68px;
      }

    }

    @media(min-width:800px){

      .intro,
      .drag-hint,
      .gallery-footer{
        max-width:1250px;

        margin-left:auto;
        margin-right:auto;
      }

      .portfolio-track{
        padding-left:
          max(
            35px,
            calc(
              (100vw - 1250px) / 2
            )
          );

        padding-right:35px;
      }

      .work-card{
        flex-basis:390px;
      }

    }

    @media(prefers-reduced-motion:reduce){

      .drag-arrow,
      .whatsapp-button,
      .whatsapp-button::before,
      .whatsapp-button::after{
        animation:none;
      }

    }

  </style>

</head>

  <!-- CONTADOR AUTOMÁTICO -->

  <script>

    const track =
      document.getElementById(
        "portfolioTrack"
      );


    const cards =
      Array.from(
        document.querySelectorAll(
          ".work-card"
        )
      );


    const currentWork =
      document.getElementById(
        "currentWork"
      );


    function updateCounter(){

      const trackRect =
        track.getBoundingClientRect();


      const reference =
        trackRect.left + 30;


      let closestIndex = 0;

      let closestDistance =
        Infinity;


      cards.forEach(
        function(card,index){

          const rect =
            card.getBoundingClientRect();


          const distance =
            Math.abs(
              rect.left -
              reference
            );


          if(
            distance <
            closestDistance
          ){

            closestDistance =
              distance;

            closestIndex =
              index;

          }

        }
      );


      currentWork.textContent =
        String(
          closestIndex + 1
        ).padStart(
          2,
          "0"
        );

    }


    let ticking = false;


    track.addEventListener(

      "scroll",

      function(){

        if(!ticking){

          window.requestAnimationFrame(
            function(){

              updateCounter();

              ticking = false;

            }
          );

          ticking = true;

        }

      },

      {
        passive:true
      }

    );


    window.addEventListener(
      "resize",
      updateCounter
    );


    updateCounter();

  </script>
