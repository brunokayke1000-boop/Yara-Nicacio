<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Yara Nicácio | Nail Artistic</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <style>

    /* ========================================
       CONFIGURAÇÕES GERAIS
    ======================================== */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      background:#050403;
      color:#ffffff;
      font-family:'Montserrat',sans-serif;
      overflow-x:hidden;
    }


    /* ========================================
       CAPA PRINCIPAL
    ======================================== */

    .hero{
      position:relative;

      width:100%;
      height:100svh;
      min-height:650px;

      overflow:hidden;

      background:#050403;
    }


    /* FOTO DE FUNDO */

    .hero-bg{
      position:absolute;

      inset:-5% 0 0 0;

      width:100%;
      height:110%;

      object-fit:cover;
      object-position:center center;

      z-index:1;

      transform:
        translate3d(0,0,0)
        scale(1.03);

      will-change:transform;
    }


    /* ESCURECIMENTO DA FOTO */

    .hero-overlay{
      position:absolute;

      inset:0;

      z-index:2;

      background:
        linear-gradient(
          to bottom,

          rgba(0,0,0,.16) 0%,

          rgba(0,0,0,.10) 35%,

          rgba(0,0,0,.28) 68%,

          rgba(3,3,3,.76) 100%
        );
    }


    /* VINHETA NAS BORDAS */

    .hero-vignette{
      position:absolute;

      inset:0;

      z-index:3;

      pointer-events:none;

      background:
        radial-gradient(
          circle at center,

          transparent 30%,

          rgba(0,0,0,.12) 60%,

          rgba(0,0,0,.52) 100%
        );
    }


    /* ========================================
       LOGOTIPO SUPERIOR DIREITO
    ======================================== */

    .top-logo{
      position:absolute;

      top:
        calc(
          24px +
          env(safe-area-inset-top)
        );

      right:20px;

      z-index:7;

      width:92px;
      height:92px;

      display:flex;

      align-items:center;
      justify-content:center;

      opacity:.92;

      filter:
        drop-shadow(
          0 7px 16px
          rgba(0,0,0,.42)
        );

      animation:
        logoEntrance
        1.3s
        ease
        forwards;
    }


    .top-logo img{
      display:block;

      width:100%;
      height:100%;

      object-fit:contain;
    }


    /* ========================================
       NOME CENTRAL
    ======================================== */

    .hero-name-wrap{
      position:absolute;

      left:50%;
      top:53%;

      transform:
        translate(-50%,-50%);

      z-index:6;

      width:min(88vw,760px);

      text-align:center;

      will-change:transform;

      filter:
        drop-shadow(
          0 14px 26px
          rgba(0,0,0,.48)
        );

      animation:
        nameEntrance
        1.5s
        .12s
        ease
        forwards;

      opacity:0;
    }


    .hero-name-wrap img{
      width:100%;
      height:auto;

      display:block;
    }


    /* BRILHO DISCRETO ATRÁS DO NOME */

    .name-glow{
      position:absolute;

      left:50%;
      top:52%;

      transform:
        translate(-50%,-50%);

      width:70vw;
      height:28vh;

      max-width:700px;

      z-index:5;

      pointer-events:none;

      background:
        radial-gradient(
          ellipse at center,

          rgba(180,128,48,.10),

          transparent 70%
        );

      filter:blur(18px);
    }


    /* ========================================
       INDICAÇÃO "DESLIZE"
    ======================================== */

    .scroll-indicator{
      position:absolute;

      left:50%;

      bottom:
        calc(
          28px +
          env(safe-area-inset-bottom)
        );

      transform:
        translateX(-50%);

      z-index:8;

      display:flex;

      flex-direction:column;

      align-items:center;

      gap:8px;

      color:
        rgba(255,255,255,.44);

      font-size:8px;

      letter-spacing:3px;

      text-transform:uppercase;
    }


    .scroll-line{
      width:1px;
      height:34px;

      background:
        linear-gradient(
          to bottom,

          #c79a53,

          transparent
        );

      animation:
        scrollLine
        1.8s
        infinite
        ease-in-out;
    }


    /* ========================================
       WHATSAPP FLUTUANTE
    ======================================== */

    .whatsapp{
      position:fixed;

      right:16px;

      bottom:
        calc(
          20px +
          env(safe-area-inset-bottom)
        );

      z-index:9999;

      width:64px;
      height:64px;

      display:flex;

      align-items:center;
      justify-content:center;

      border-radius:50%;

      text-decoration:none;

      transform-origin:center;

      animation:
        whatsappPulse
        1.75s
        infinite
        ease-in-out;

      filter:
        drop-shadow(
          0 10px 18px
          rgba(0,0,0,.46)
        );
    }


    .whatsapp img{
      display:block;

      width:100%;
      height:100%;

      object-fit:contain;

      pointer-events:none;
    }


    /* ONDA DOURADA DO WHATSAPP */

    .whatsapp::before{
      content:"";

      position:absolute;

      inset:-4px;

      border-radius:50%;

      border:
        1px solid
        rgba(211,158,61,.55);

      animation:
        whatsappRing
        1.75s
        infinite
        ease-out;

      pointer-events:none;
    }


    /* ========================================
       PRÓXIMA SEÇÃO
    ======================================== */

    .intro{
      min-height:70vh;

      display:flex;

      align-items:center;
      justify-content:center;

      padding:
        90px
        24px;

      text-align:center;

      background:
        linear-gradient(
          to bottom,

          #050403 0%,

          #090704 100%
        );
    }


    .intro-content{
      max-width:600px;
    }


    .intro-small{
      display:block;

      margin-bottom:18px;

      font-size:9px;

      letter-spacing:5px;

      text-transform:uppercase;

      color:#b78a4b;
    }


    .intro h2{
      font-family:
        'Cormorant Garamond',
        serif;

      font-size:
        clamp(
          36px,
          9vw,
          62px
        );

      line-height:1.05;

      font-weight:400;

      color:#eee7dc;
    }


    /* ========================================
       ANIMAÇÕES
    ======================================== */

    @keyframes logoEntrance{

      from{
        opacity:0;

        transform:
          translateY(-15px)
          scale(.94);
      }

      to{
        opacity:.92;

        transform:
          translateY(0)
          scale(1);
      }

    }


    @keyframes nameEntrance{

      from{
        opacity:0;

        transform:
          translate(-50%,-42%)
          scale(.96);
      }

      to{
        opacity:1;

        transform:
          translate(-50%,-50%)
          scale(1);
      }

    }


    @keyframes scrollLine{

      0%,
      100%{
        opacity:.35;

        transform:
          scaleY(.7);
      }

      50%{
        opacity:1;

        transform:
          scaleY(1);
      }

    }


    /* PULSO DO PRÓPRIO LOGOTIPO */

    @keyframes whatsappPulse{

      0%,
      100%{
        transform:
          scale(1);
      }

      50%{
        transform:
          scale(1.12);
      }

    }


    /* ONDA EXTERNA */

    @keyframes whatsappRing{

      0%{
        opacity:.75;

        transform:
          scale(.88);
      }

      70%{
        opacity:0;

        transform:
          scale(1.38);
      }

      100%{
        opacity:0;

        transform:
          scale(1.38);
      }

    }


    /* ========================================
       AJUSTES PARA CELULAR
    ======================================== */

    @media(max-width:600px){

      .hero{
        height:100svh;
      }


      .hero-bg{
        object-position:
          center top;
      }


      .top-logo{
        width:74px;
        height:74px;

        right:14px;

        top:
          calc(
            18px +
            env(safe-area-inset-top)
          );
      }


      .hero-name-wrap{
        width:88vw;

        top:55%;
      }


      .name-glow{
        width:88vw;

        height:24vh;
      }


      .whatsapp{
        width:60px;
        height:60px;

        right:16px;
      }

    }

  </style>
</head>


<body>


  <!-- ======================================
       CAPA
  ======================================= -->

  <section
    class="hero"
    id="hero"
  >


    <!-- FOTO PRINCIPAL -->

    <img
      class="hero-bg"
      id="heroBg"

      src="521D5ECF-2893-4075-8886-F7688E2AAFE0.jpeg"

      alt="Yara Nicácio Nail Artistic"
    >


    <!-- CAMADAS DA CAPA -->

    <div class="hero-overlay"></div>

    <div class="hero-vignette"></div>


    <!-- LOGOTIPO SUPERIOR DIREITO -->

    <div class="top-logo">

      <img
        src="B246332E-6D6E-47D0-B3DD-02096818D8AD.png"

        alt="Logo Yara Nicácio"
      >

    </div>


    <!-- BRILHO ATRÁS DO NOME -->

    <div class="name-glow"></div>


    <!-- NOME CENTRAL -->

    <div
      class="hero-name-wrap"
      id="heroName"
    >

      <img
        src="6F8DA6F0-A1F8-408E-89EB-F56A7A4E9896.png"

        alt="Yara Nicácio Nail Artistic"
      >

    </div>


    <!-- DESLIZE -->

    <div class="scroll-indicator">

      Deslize

      <div class="scroll-line"></div>

    </div>


  </section>


  <!-- ======================================
       SEGUNDA SEÇÃO
  ======================================= -->

  <section class="intro">

    <div class="intro-content">

      <span class="intro-small">
        Yara Nicácio
      </span>

      <h2>
        Sofisticação presente<br>
        em cada detalhe.
      </h2>

    </div>

  </section>


  <!-- ======================================
       WHATSAPP FLUTUANTE
  ======================================= -->

  <a
    class="whatsapp"

    href="https://wa.me/5511932942455?text=Ol%C3%A1%2C%20gostaria%20de%20fazer%20as%20unhas%20com%20a%20Yara%20Nic%C3%A1cio%21%21%20%F0%9F%98%8A%F0%9F%92%85"

    target="_blank"

    rel="noopener noreferrer"

    aria-label="Agendar horário com Yara Nicácio pelo WhatsApp"
  >

    <img
      src="0F16142F-FE3F-4FF5-B505-D1D0285A19CA.png"

      alt="WhatsApp"
    >

  </a>


  <!-- ======================================
       PARALLAX / EFEITO FLUTUANTE
  ======================================= -->

  <script>

    const hero =
      document.getElementById('hero');

    const heroBg =
      document.getElementById('heroBg');

    const heroName =
      document.getElementById('heroName');


    let ticking = false;


    function updateParallax(){

      const scrollY =
        window.scrollY;

      const heroHeight =
        hero.offsetHeight;


      if(scrollY <= heroHeight){

        /*
          A foto se movimenta lentamente.
          O nome se movimenta em outra
          velocidade.

          Isso cria a sensação de que
          o nome está separado da foto.
        */


        heroBg.style.transform =
          `translate3d(
            0,
            ${scrollY * 0.13}px,
            0
          )
          scale(1.03)`;


        heroName.style.transform =
          `translate(
            -50%,
            calc(
              -50% +
              ${scrollY * 0.06}px
            )
          )`;

      }


      ticking = false;

    }


    window.addEventListener(

      'scroll',

      () => {

        if(!ticking){

          window.requestAnimationFrame(
            updateParallax
          );

          ticking = true;

        }

      },

      {
        passive:true
      }

    );

  </script>


</body>
</html>
