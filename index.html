<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Yara Nicácio | Nail Artistic</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      background:#050403;
      color:#fff;
      font-family:'Montserrat', sans-serif;
      overflow-x:hidden;
    }

    /* =========================
       CAPA PRINCIPAL
    ========================= */

    .hero{
      position:relative;
      width:100%;
      height:100svh;
      min-height:650px;
      overflow:hidden;
      background:#050403;

      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* FOTO DE FUNDO */

    .hero-image{
      position:absolute;
      inset:0;

      width:100%;
      height:100%;

      object-fit:cover;

      /*
      Ajuste essa posição se quiser
      subir ou descer a foto.
      */

      object-position:center center;

      z-index:1;

      transform:scale(1.01);
    }

    /* CAMADA ESCURA */

    .hero-overlay{
      position:absolute;
      inset:0;
      z-index:2;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.12) 0%,
          rgba(0,0,0,.12) 35%,
          rgba(0,0,0,.28) 70%,
          rgba(0,0,0,.72) 100%
        );
    }

    /* VINHETA */

    .hero-vignette{
      position:absolute;
      inset:0;
      z-index:3;

      pointer-events:none;

      background:
        radial-gradient(
          circle at center,
          transparent 35%,
          rgba(0,0,0,.15) 65%,
          rgba(0,0,0,.58) 100%
        );
    }

    /* CONTEÚDO CENTRAL */

    .hero-content{
      position:relative;
      z-index:5;

      width:100%;

      padding:0 24px;

      text-align:center;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;

      transform:translateY(6vh);
    }

    /* NOME */

    .hero-title{
      font-family:'Cormorant Garamond', serif;

      font-size:clamp(48px, 12vw, 100px);

      font-weight:500;

      line-height:.9;

      letter-spacing:3px;

      color:#f5efe6;

      text-shadow:
        0 3px 22px rgba(0,0,0,.75);

      animation:
        fadeUp 1.25s ease forwards;

      opacity:0;
    }

    /* SUBTÍTULO */

    .hero-subtitle{
      margin-top:17px;

      font-size:clamp(10px, 2.6vw, 14px);

      font-weight:400;

      letter-spacing:6px;

      text-transform:uppercase;

      color:#caa66c;

      text-shadow:
        0 2px 15px rgba(0,0,0,.8);

      animation:
        fadeUp 1.25s .22s ease forwards;

      opacity:0;
    }

    /* LINHA DOURADA */

    .hero-line{
      margin-top:22px;

      width:45px;
      height:1px;

      background:
        linear-gradient(
          to right,
          transparent,
          #c39a5d,
          transparent
        );

      animation:
        fadeIn 1.3s .5s ease forwards;

      opacity:0;
    }

    /* INDICAÇÃO DE DESLIZAR */

    .scroll-indicator{
      position:absolute;

      left:50%;
      bottom:28px;

      transform:translateX(-50%);

      z-index:6;

      display:flex;
      flex-direction:column;
      align-items:center;

      gap:8px;

      color:rgba(255,255,255,.45);

      font-size:8px;

      letter-spacing:3px;

      text-transform:uppercase;
    }

    .scroll-line{
      width:1px;
      height:34px;

      background:
        linear-gradient(
          to bottom,
          #c69e61,
          transparent
        );

      animation:
        scrollPulse 1.8s infinite ease-in-out;
    }

    /* =========================
       WHATSAPP FLUTUANTE
    ========================= */

    .whatsapp-float{
      position:fixed;

      right:18px;
      bottom:
        calc(20px + env(safe-area-inset-bottom));

      z-index:9999;

      width:58px;
      height:58px;

      border-radius:50%;

      background:#25D366;

      display:flex;

      align-items:center;
      justify-content:center;

      text-decoration:none;

      box-shadow:
        0 10px 28px rgba(0,0,0,.45);

      animation:
        whatsappPulse 2s infinite;

      transition:
        transform .25s ease;
    }

    .whatsapp-float:active{
      transform:scale(.92);
    }

    .whatsapp-float svg{
      width:31px;
      height:31px;

      fill:#fff;
    }

    /* EFEITO EXTERNO DO PULSO */

    .whatsapp-float::before{
      content:"";

      position:absolute;

      inset:-6px;

      border-radius:50%;

      border:
        1px solid rgba(37,211,102,.55);

      animation:
        whatsappRing 2s infinite;
    }

    /* =========================
       PRÓXIMA SEÇÃO
    ========================= */

    .intro{
      min-height:65vh;

      background:
        linear-gradient(
          to bottom,
          #050403 0%,
          #080604 100%
        );

      display:flex;

      align-items:center;
      justify-content:center;

      text-align:center;

      padding:90px 25px;
    }

    .intro span{
      display:block;

      margin-bottom:16px;

      color:#b28b54;

      font-size:9px;

      letter-spacing:5px;

      text-transform:uppercase;
    }

    .intro h2{
      font-family:'Cormorant Garamond', serif;

      font-weight:400;

      font-size:clamp(35px, 9vw, 60px);

      line-height:1.05;

      color:#f0e9df;
    }

    /* =========================
       ANIMAÇÕES
    ========================= */

    @keyframes fadeUp{

      from{
        opacity:0;
        transform:translateY(30px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }

    }

    @keyframes fadeIn{

      from{
        opacity:0;
      }

      to{
        opacity:1;
      }

    }

    @keyframes scrollPulse{

      0%,100%{
        opacity:.35;
        transform:scaleY(.7);
      }

      50%{
        opacity:1;
        transform:scaleY(1);
      }

    }

    @keyframes whatsappPulse{

      0%{
        box-shadow:
          0 0 0 0 rgba(37,211,102,.42),
          0 10px 28px rgba(0,0,0,.45);
      }

      70%{
        box-shadow:
          0 0 0 15px rgba(37,211,102,0),
          0 10px 28px rgba(0,0,0,.45);
      }

      100%{
        box-shadow:
          0 0 0 0 rgba(37,211,102,0),
          0 10px 28px rgba(0,0,0,.45);
      }

    }

    @keyframes whatsappRing{

      0%{
        opacity:.8;
        transform:scale(.85);
      }

      70%{
        opacity:0;
        transform:scale(1.35);
      }

      100%{
        opacity:0;
        transform:scale(1.35);
      }

    }

    /* =========================
       CELULAR
    ========================= */

    @media(max-width:600px){

      .hero{
        height:100svh;
      }

      .hero-image{
        object-position:center top;
      }

      .hero-content{
        transform:translateY(7vh);
      }

      .hero-title{
        font-size:clamp(46px, 15vw, 72px);
        letter-spacing:2px;
      }

      .hero-subtitle{
        letter-spacing:5px;
      }

      .whatsapp-float{
        width:56px;
        height:56px;
        right:16px;
      }

      .whatsapp-float svg{
        width:30px;
        height:30px;
      }

    }

  </style>

</head>

<body>

  <!-- CAPA -->

  <section class="hero">

    <img
      class="hero-image"
      src="15A69808-E88F-4B7E-A426-88B2FF17990B.jpeg"
      alt="Yara Nicácio Nail Artistic"
    >

    <div class="hero-overlay"></div>

    <div class="hero-vignette"></div>

    <div class="hero-content">

      <h1 class="hero-title">
        YARA NICÁCIO
      </h1>

      <div class="hero-subtitle">
        Nail Artistic
      </div>

      <div class="hero-line"></div>

    </div>

    <div class="scroll-indicator">

      Deslize

      <div class="scroll-line"></div>

    </div>

  </section>


  <!-- PRÓXIMA SEÇÃO -->

  <section class="intro">

    <div>

      <span>
        Yara Nicácio
      </span>

      <h2>
        Beleza construída<br>
        nos mínimos detalhes.
      </h2>

    </div>

  </section>


  <!-- WHATSAPP FLUTUANTE -->

  <a
    class="whatsapp-float"
    href="https://wa.me/5511932942455"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Falar com Yara pelo WhatsApp"
  >

</body>
