<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Yara Nicácio | Nail Artistic</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap"
    rel="stylesheet"
  >


  <style>

    /* ========================================
       CONFIGURAÇÕES GERAIS
    ======================================== */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }


    html{
      scroll-behavior:smooth;
    }


    body{
      margin:0;

      background:#050403;

      color:#ffffff;

      font-family:
        'Montserrat',
        sans-serif;

      overflow-x:hidden;
    }



    /* ========================================
       CAPA PRINCIPAL
    ======================================== */

    .hero{

      position:relative;

      width:100%;

      height:100svh;

      min-height:650px;

      overflow:hidden;

      background:#050403;

    }



    /* ========================================
       FOTO DE FUNDO
    ======================================== */

    .hero-bg{

      position:absolute;

      inset:-5% 0 0 0;

      width:100%;

      height:110%;

      object-fit:cover;

      object-position:center center;

      z-index:1;


      transform:
        translate3d(0,0,0)
        scale(1.04);


      will-change:transform;


      /* deixa a fotografia mais elegante
         e menos dominante */

      filter:
        brightness(.78)
        contrast(.94)
        saturate(.82);

    }



    /* ========================================
       ESCURECIMENTO DA CAPA
    ======================================== */

    .hero-overlay{

      position:absolute;

      inset:0;

      z-index:2;


      background:

        linear-gradient(

          to bottom,

          rgba(0,0,0,.42) 0%,

          rgba(0,0,0,.38) 32%,

          rgba(0,0,0,.45) 62%,

          rgba(3,3,3,.72) 82%,

          #050403 100%

        );

    }



    /* ========================================
       VINHETA
    ======================================== */

    .hero-vignette{

      position:absolute;

      inset:0;

      z-index:3;

      pointer-events:none;


      background:

        radial-gradient(

          ellipse at center,

          rgba(0,0,0,.02) 15%,

          rgba(0,0,0,.10) 48%,

          rgba(0,0,0,.48) 100%

        );

    }



    /* ========================================
       LUZ SUAVE NO CENTRO
    ======================================== */

    .center-light{

      position:absolute;

      left:50%;

      top:52%;

      transform:
        translate(-50%,-50%);


      width:90vw;

      max-width:800px;

      height:38vh;


      z-index:4;

      pointer-events:none;


      background:

        radial-gradient(

          ellipse at center,

          rgba(177,126,48,.10),

          rgba(177,126,48,.025) 42%,

          transparent 72%

        );


      filter:
        blur(22px);

    }



    /* ========================================
       LOGOTIPO SUPERIOR DIREITO
    ======================================== */

    .top-logo{

      position:absolute;


      top:
        calc(
          22px +
          env(safe-area-inset-top)
        );


      right:18px;


      z-index:8;


      width:90px;

      height:90px;


      display:flex;

      align-items:center;

      justify-content:center;


      opacity:.92;


      filter:

        drop-shadow(
          0 7px 18px
          rgba(0,0,0,.60)
        );


      animation:

        logoEntrance
        1.4s
        ease
        forwards;

    }



    .top-logo img{

      display:block;

      width:100%;

      height:100%;

      object-fit:contain;

    }



    /* ========================================
       ÁREA CENTRAL
    ======================================== */

    .hero-center{

      position:absolute;

      left:50%;

      top:52%;


      transform:
        translate(-50%,-50%);


      z-index:7;


      width:100%;


      display:flex;

      flex-direction:column;

      align-items:center;


      text-align:center;


      padding:
        0 20px;


      will-change:transform;

    }



    /* ========================================
       NOME YARA NICÁCIO
    ======================================== */

    .hero-name{

      position:relative;


      width:
        min(
          88vw,
          760px
        );


      filter:

        drop-shadow(
          0 8px 14px
          rgba(0,0,0,.65)
        )

        drop-shadow(
          0 18px 32px
          rgba(0,0,0,.50)
        );


      opacity:0;


      animation:

        nameEntrance
        1.5s
        .12s
        ease
        forwards;

    }



    .hero-name img{

      display:block;

      width:100%;

      height:auto;

    }



    /* ========================================
       FRASE
    ======================================== */

    .hero-phrase{

      position:relative;


      margin-top:15px;


      width:90%;

      max-width:540px;


      font-family:
        'Cormorant Garamond',
        serif;


      font-size:
        clamp(
          18px,
          4.7vw,
          25px
        );


      font-weight:400;


      line-height:1.25;


      letter-spacing:.8px;


      color:
        rgba(255,255,255,.90);


      text-shadow:

        0 3px 12px
        rgba(0,0,0,.90),

        0 8px 22px
        rgba(0,0,0,.65);


      opacity:0;


      animation:

        phraseEntrance
        1.4s
        .75s
        ease
        forwards;

    }



    /* PEQUENO DETALHE DOURADO */

    .phrase-line{

      width:36px;

      height:1px;


      margin-top:18px;


      background:

        linear-gradient(

          to right,

          transparent,

          #c89a52,

          transparent

        );


      opacity:0;


      animation:

        fadeIn
        1.3s
        1.1s
        ease
        forwards;

    }



    /* ========================================
       DESLIZE
    ======================================== */

    .scroll-indicator{

      position:absolute;


      left:50%;


      bottom:

        calc(
          25px +
          env(safe-area-inset-bottom)
        );


      transform:
        translateX(-50%);


      z-index:8;


      display:flex;


      flex-direction:column;


      align-items:center;


      gap:8px;


      color:
        rgba(255,255,255,.42);


      font-size:8px;


      letter-spacing:3px;


      text-transform:uppercase;

    }



    .scroll-line{

      width:1px;

      height:32px;


      background:

        linear-gradient(

          to bottom,

          #c79a53,

          transparent

        );


      transform-origin:top;


      animation:

        scrollLine
        1.8s
        infinite
        ease-in-out;

    }



    /* ========================================
       WHATSAPP FLUTUANTE
    ======================================== */

    .whatsapp{

      position:fixed;


      right:16px;


      bottom:

        calc(
          20px +
          env(safe-area-inset-bottom)
        );


      z-index:9999;


      width:62px;

      height:62px;


      display:flex;


      align-items:center;

      justify-content:center;


      border-radius:50%;


      text-decoration:none;


      transform-origin:center;


      animation:

        whatsappPulse
        1.7s
        infinite
        ease-in-out;


      filter:

        drop-shadow(
          0 9px 20px
          rgba(0,0,0,.60)
        );

    }



    .whatsapp img{

      display:block;

      width:100%;

      height:100%;

      object-fit:contain;

      pointer-events:none;

    }



    /* PULSO EXTERNO */

    .whatsapp::before{

      content:"";


      position:absolute;


      inset:-5px;


      border-radius:50%;


      border:

        1px solid
        rgba(211,158,61,.60);


      animation:

        whatsappRing
        1.7s
        infinite
        ease-out;


      pointer-events:none;

    }



    /* SEGUNDO PULSO */

    .whatsapp::after{

      content:"";


      position:absolute;


      inset:-3px;


      border-radius:50%;


      border:

        1px solid
        rgba(211,158,61,.30);


      animation:

        whatsappRingTwo
        1.7s
        .35s
        infinite
        ease-out;


      pointer-events:none;

    }



    /* ========================================
       SEGUNDA SEÇÃO
    ======================================== */

    .intro{

      position:relative;


      min-height:70vh;


      display:flex;


      align-items:center;

      justify-content:center;


      padding:

        100px
        25px;


      text-align:center;


      background:

        linear-gradient(

          to bottom,

          #050403 0%,

          #080604 50%,

          #0a0805 100%

        );

    }



    .intro-content{

      max-width:600px;

    }



    .intro-small{

      display:block;


      margin-bottom:18px;


      color:#b78a4b;


      font-size:9px;


      letter-spacing:5px;


      text-transform:uppercase;

    }



    .intro h2{

      font-family:

        'Cormorant Garamond',
        serif;


      font-size:

        clamp(
          36px,
          9vw,
          62px
        );


      line-height:1.05;


      font-weight:400;


      color:#eee7dc;

    }



    /* ========================================
       ANIMAÇÕES
    ======================================== */

    @keyframes logoEntrance{

      from{

        opacity:0;


        transform:

          translateY(-14px)
          scale(.94);

      }


      to{

        opacity:.92;


        transform:

          translateY(0)
          scale(1);

      }

    }



    @keyframes nameEntrance{

      from{

        opacity:0;


        transform:

          translateY(28px)
          scale(.96);

      }


      to{

        opacity:1;


        transform:

          translateY(0)
          scale(1);

      }

    }



    @keyframes phraseEntrance{

      from{

        opacity:0;

        transform:
          translateY(15px);

      }


      to{

        opacity:1;

        transform:
          translateY(0);

      }

    }



    @keyframes fadeIn{

      from{
        opacity:0;
      }


      to{
        opacity:1;
      }

    }



    @keyframes scrollLine{

      0%,
      100%{

        opacity:.3;

        transform:
          scaleY(.65);

      }


      50%{

        opacity:1;

        transform:
          scaleY(1);

      }

    }



    /* O PRÓPRIO WHATSAPP PULSA */

    @keyframes whatsappPulse{

      0%,
      100%{

        transform:
          scale(1);

      }


      50%{

        transform:
          scale(1.13);

      }

    }



    @keyframes whatsappRing{

      0%{

        opacity:.75;

        transform:
          scale(.85);

      }


      75%{

        opacity:0;

        transform:
          scale(1.42);

      }


      100%{

        opacity:0;

        transform:
          scale(1.42);

      }

    }



    @keyframes whatsappRingTwo{

      0%{

        opacity:.50;

        transform:
          scale(.90);

      }


      75%{

        opacity:0;

        transform:
          scale(1.30);

      }


      100%{

        opacity:0;

        transform:
          scale(1.30);

      }

    }



    /* ========================================
       CELULAR
    ======================================== */

    @media(max-width:600px){


      .hero{

        height:100svh;

        min-height:620px;

      }



      .hero-bg{

        object-position:
          center top;

      }



      .top-logo{

        width:72px;

        height:72px;


        right:14px;


        top:

          calc(
            17px +
            env(safe-area-inset-top)
          );

      }



      .hero-center{

        top:54%;

      }



      .hero-name{

        width:90vw;

      }



      .hero-phrase{

        margin-top:12px;


        width:88%;


        font-size:
          clamp(
            18px,
            5vw,
            22px
          );

      }



      .whatsapp{

        width:59px;

        height:59px;


        right:15px;

      }

    }



    /* ========================================
       REDUÇÃO DE MOVIMENTO
    ======================================== */

    @media(prefers-reduced-motion:reduce){

      *{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        scroll-behavior:auto !important;

      }

    }

  </style>

</head>



<body>


  <!-- ======================================
       CAPA
  ======================================= -->

  <section
    class="hero"
    id="hero"
  >


    <!-- NOVA FOTO DE FUNDO -->

    <img

      class="hero-bg"

      id="heroBg"

      src="521D5ECF-2893-4075-8886-F7688E2AAFE0.jpeg"

      alt="Yara Nicácio Nail Artistic"

    >



    <!-- ESCURECIMENTO -->

    <div class="hero-overlay"></div>


    <!-- VINHETA -->

    <div class="hero-vignette"></div>


    <!-- LUZ CENTRAL -->

    <div class="center-light"></div>



    <!-- ====================================
         MONOGRAMA SUPERIOR DIREITO
    ===================================== -->

    <div class="top-logo">

      <img

        src="B246332E-6D6E-47D0-B3DD-02096818D8AD.png"

        alt="Logo Yara Nicácio"

      >

    </div>



    <!-- ====================================
         CONTEÚDO CENTRAL
    ===================================== -->

    <div
      class="hero-center"
      id="heroCenter"
    >


      <!-- YARA NICÁCIO + NAIL ARTISTIC -->

      <div class="hero-name">

        <img

          src="6F8DA6F0-A1F8-408E-89EB-F56A7A4E9896.png"

          alt="Yara Nicácio Nail Artistic"

        >

      </div>



      <!-- FRASE -->

      <p class="hero-phrase">

        O que você escolhe, vira arte em suas unhas

      </p>



      <!-- DETALHE DOURADO -->

      <div class="phrase-line"></div>


    </div>



    <!-- ====================================
         DESLIZE
    ===================================== -->

    <div class="scroll-indicator">

      Deslize

      <div class="scroll-line"></div>

    </div>


  </section>



  <!-- ======================================
       SEGUNDA SEÇÃO
  ======================================= -->

  <section class="intro">


    <div class="intro-content">


      <span class="intro-small">

        Yara Nicácio

      </span>


      <h2>

        Sofisticação presente<br>

        em cada detalhe.

      </h2>


    </div>


  </section>



  <!-- ======================================
       WHATSAPP FLUTUANTE
  ======================================= -->

  <a

    class="whatsapp"

    href="https://wa.me/5511932942455?text=Ol%C3%A1%2C%20gostaria%20de%20fazer%20as%20unhas%20com%20a%20Yara%20Nic%C3%A1cio%21%21%20%F0%9F%98%8A%F0%9F%92%85"

    target="_blank"

    rel="noopener noreferrer"

    aria-label="Agendar horário com Yara Nicácio pelo WhatsApp"

  >


    <img

      src="0F16142F-FE3F-4FF5-B505-D1D0285A19CA.png"

      alt="WhatsApp"

    >


  </a>



  <!-- ======================================
       EFEITO FLUTUANTE / PARALLAX
  ======================================= -->

  <script>


    const hero =
      document.getElementById('hero');


    const heroBg =
      document.getElementById('heroBg');


    const heroCenter =
      document.getElementById('heroCenter');


    let ticking = false;



    function updateParallax(){


      const scrollY =
        window.scrollY;


      const heroHeight =
        hero.offsetHeight;



      if(scrollY <= heroHeight){


        /*
          FUNDO:
          movimenta lentamente.
        */

        heroBg.style.transform =

          `translate3d(
            0,
            ${scrollY * 0.12}px,
            0
          )
          scale(1.04)`;



        /*
          NOME + FRASE:
          movimentam em velocidade
          diferente do fundo.

          Isso cria a sensação
          de profundidade.
        */

        heroCenter.style.transform =

          `translate(
            -50%,
            calc(
              -50% +
              ${scrollY * 0.045}px
            )
          )`;


      }


      ticking = false;


    }



    window.addEventListener(

      'scroll',

      () => {


        if(!ticking){


          window.requestAnimationFrame(

            updateParallax

          );


          ticking = true;


        }


      },


      {
        passive:true
      }

    );


  </script>


</body>

</html>
