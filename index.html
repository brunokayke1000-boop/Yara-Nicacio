<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#050505">

  <title>Yara Nicácio | Nail Artistic</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
      background:#050505;
    }

    body{
      margin:0;

      background:#050505;

      color:#ffffff;

      overflow-x:hidden;

      font-family:
        'Montserrat',
        sans-serif;
    }


    /* ========================================
       CAPA
    ======================================== */

    .hero{
      position:relative;

      width:100%;

      height:100svh;

      min-height:680px;

      overflow:hidden;

      background:#050505;

      isolation:isolate;
    }


    /* ========================================
       NOVA FOTO DE FUNDO
       SEM ALTERAÇÃO DE COR
    ======================================== */

    .hero-background{
      position:absolute;

      inset:0;

      width:100%;
      height:100%;

      object-fit:cover;

      object-position:center center;

      z-index:0;

      filter:none;

      opacity:1;

      transform:none;
    }


    /* ========================================
       DEGRADÊ PARA O PRETO
       SEM CORTE RETO
    ======================================== */

    .bottom-fade{
      position:absolute;

      left:0;
      right:0;
      bottom:0;

      height:48%;

      z-index:1;

      pointer-events:none;

      background:
        linear-gradient(
          to bottom,

          rgba(5,5,5,0) 0%,

          rgba(5,5,5,.04) 18%,

          rgba(5,5,5,.13) 34%,

          rgba(5,5,5,.30) 52%,

          rgba(5,5,5,.58) 70%,

          rgba(5,5,5,.84) 86%,

          #050505 100%
        );
    }


    /* ========================================
       BRILHOS DOURADOS
    ======================================== */

    .gold-sparkles{
      position:absolute;

      inset:-3%;

      width:106%;
      height:106%;

      z-index:2;

      object-fit:cover;

      object-position:center;

      pointer-events:none;

      mix-blend-mode:screen;

      opacity:.19;

      animation:
        sparklePulse
        3s
        ease-in-out
        infinite;

      will-change:
        opacity,
        transform;
    }


    @keyframes sparklePulse{

      0%,
      100%{
        opacity:.13;

        transform:
          scale(1);
      }

      50%{
        opacity:.30;

        transform:
          scale(1.016);
      }

    }


    /* ========================================
       LOGOTIPO SUPERIOR DIREITO
    ======================================== */

    .top-logo{
      position:absolute;

      top:
        max(
          27px,
          env(safe-area-inset-top)
        );

      right:19px;

      width:125px;

      height:auto;

      object-fit:contain;

      z-index:5;

      filter:
        drop-shadow(
          0 5px 12px
          rgba(0,0,0,.70)
        )

        drop-shadow(
          0 0 7px
          rgba(207,159,67,.12)
        );

      will-change:transform;
    }


    /* ========================================
       CONTEÚDO CENTRAL
    ======================================== */

    .hero-content{
      position:absolute;

      top:50%;

      left:50%;

      width:min(96%,920px);

      transform:
        translate(-50%,-50%);

      z-index:4;

      display:flex;

      flex-direction:column;

      align-items:center;

      justify-content:center;

      text-align:center;

      will-change:transform;
    }


    /* ========================================
       YARA NICÁCIO
    ======================================== */

    .name-image{
      display:block;

      width:min(98vw,920px);

      max-width:100%;

      height:auto;

      object-fit:contain;

      margin:0 auto;

      filter:
        drop-shadow(
          0 7px 10px
          rgba(0,0,0,.90)
        )

        drop-shadow(
          0 16px 25px
          rgba(0,0,0,.72)
        )

        drop-shadow(
          0 0 7px
          rgba(255,255,255,.18)
        );
    }


    /* ========================================
       NAIL ARTISTIC
       PRATICAMENTE UNIDO AO NOME
    ======================================== */

    .nail-artistic-wrap{
      width:min(82vw,680px);

      /*
        VALOR NEGATIVO PARA PUXAR
        O NAIL ARTISTIC PARA CIMA
      */

      margin-top:-15px;

      display:flex;

      align-items:center;

      justify-content:center;

      position:relative;

      z-index:2;
    }


    .nail-artistic{
      display:block;

      width:100%;

      height:auto;

      object-fit:contain;

      opacity:1;

      filter:
        brightness(1.8)
        saturate(.55)
        contrast(1.12)

        drop-shadow(
          0 3px 5px
          rgba(0,0,0,.90)
        )

        drop-shadow(
          0 0 6px
          rgba(255,221,150,.42)
        )

        drop-shadow(
          0 0 12px
          rgba(218,171,76,.22)
        );
    }


    /* ========================================
       FRASE
    ======================================== */

    .hero-phrase{
      margin-top:2px;

      width:100%;

      font-family:
        'Cormorant Garamond',
        Georgia,
        serif;

      font-size:
        clamp(
          20px,
          4.5vw,
          30px
        );

      font-weight:400;

      line-height:1.2;

      letter-spacing:.025em;

      color:
        rgba(245,233,211,.94);

      white-space:nowrap;

      text-align:center;

      text-shadow:
        0 3px 7px
        rgba(0,0,0,.95),

        0 8px 18px
        rgba(0,0,0,.82),

        0 0 8px
        rgba(209,166,87,.15);
    }


    .phrase-detail{
      width:48px;

      height:1px;

      margin-top:13px;

      background:
        linear-gradient(
          90deg,

          transparent,

          rgba(218,171,76,.85),

          transparent
        );

      box-shadow:
        0 0 7px
        rgba(218,171,76,.25);
    }


    /* ========================================
       DESLIZE
    ======================================== */

    .scroll-indicator{
      position:absolute;

      bottom:
        max(
          42px,
          calc(
            env(safe-area-inset-bottom)
            + 25px
          )
        );

      left:50%;

      transform:
        translateX(-50%);

      z-index:5;

      display:flex;

      flex-direction:column;

      align-items:center;

      gap:11px;

      pointer-events:none;
    }


    .scroll-indicator span{
      color:
        rgba(255,255,255,.34);

      font-size:10px;

      font-weight:400;

      letter-spacing:.42em;

      padding-left:.42em;
    }


    .scroll-line{
      width:1px;

      height:42px;

      background:
        linear-gradient(
          to bottom,

          rgba(202,154,67,.65),

          transparent
        );

      animation:
        scrollLine
        2.2s
        ease-in-out
        infinite;
    }


    @keyframes scrollLine{

      0%,
      100%{
        opacity:.25;

        transform:
          scaleY(.7);

        transform-origin:top;
      }

      50%{
        opacity:.85;

        transform:
          scaleY(1);

        transform-origin:top;
      }

    }


    /* ========================================
       WHATSAPP
    ======================================== */

    .whatsapp-button{
      position:fixed;

      right:18px;

      bottom:
        max(
          22px,
          calc(
            env(safe-area-inset-bottom)
            + 16px
          )
        );

      width:76px;

      height:76px;

      z-index:100;

      display:flex;

      align-items:center;

      justify-content:center;

      border-radius:50%;

      text-decoration:none;

      animation:
        whatsappPulse
        3s
        ease-in-out
        infinite;

      -webkit-tap-highlight-color:
        transparent;
    }


    .whatsapp-button::before,
    .whatsapp-button::after{
      content:"";

      position:absolute;

      border-radius:50%;

      pointer-events:none;
    }


    .whatsapp-button::before{
      inset:-7px;

      border:
        1px solid
        rgba(214,167,73,.30);

      animation:
        whatsappRing
        3s
        ease-in-out
        infinite;
    }


    .whatsapp-button::after{
      inset:-16px;

      border:
        1px solid
        rgba(214,167,73,.12);

      animation:
        whatsappRingOuter
        3s
        ease-in-out
        infinite;
    }


    .whatsapp-button img{
      position:relative;

      width:100%;

      height:100%;

      object-fit:contain;

      z-index:2;

      filter:
        drop-shadow(
          0 5px 10px
          rgba(0,0,0,.85)
        )

        drop-shadow(
          0 0 7px
          rgba(214,167,73,.18)
        );
    }


    @keyframes whatsappPulse{

      0%,
      100%{
        transform:
          scale(1);
      }

      50%{
        transform:
          scale(1.075);
      }

    }


    @keyframes whatsappRing{

      0%,
      100%{
        opacity:.28;

        transform:
          scale(.94);
      }

      50%{
        opacity:.65;

        transform:
          scale(1.08);
      }

    }


    @keyframes whatsappRingOuter{

      0%,
      100%{
        opacity:.10;

        transform:
          scale(.92);
      }

      50%{
        opacity:.35;

        transform:
          scale(1.10);
      }

    }


    /* ========================================
       PRÓXIMA SEÇÃO
    ======================================== */

    .next-section{
      position:relative;

      min-height:70vh;

      margin-top:0;

      background:
        linear-gradient(
          to bottom,

          #050505 0%,

          #070604 45%,

          #090705 100%
        );

      z-index:10;
    }


    /* ========================================
       CELULAR
    ======================================== */

    @media(max-width:600px){

      .hero{
        min-height:100svh;
      }


      .hero-background{
        object-position:center center;
      }


      /*
        DEGRADÊ MAIS AMPLO NO CELULAR
        PARA NÃO APARECER CORTE.
      */

      .bottom-fade{
        height:52%;
      }


      .gold-sparkles{
        inset:-2%;

        width:104%;

        height:104%;

        opacity:.18;
      }


      .top-logo{
        width:125px;

        top:
          max(
            27px,
            env(safe-area-inset-top)
          );

        right:19px;
      }


      .hero-content{
        top:50.5%;

        width:97%;
      }


      .name-image{
        width:98vw;
      }


      /*
        AQUI FICA AINDA MAIS JUNTO
        NO CELULAR.
      */

      .nail-artistic-wrap{
        width:83vw;

        margin-top:-17px;
      }


      .hero-phrase{
        margin-top:1px;

        font-size:
          clamp(
            18px,
            4.45vw,
            22px
          );

        letter-spacing:.01em;

        white-space:nowrap;
      }


      .whatsapp-button{
        width:76px;

        height:76px;

        right:18px;
      }

    }


    @media(max-width:390px){

      .hero-content{
        width:98%;
      }


      .name-image{
        width:98vw;
      }


      .nail-artistic-wrap{
        width:84vw;

        margin-top:-15px;
      }


      .hero-phrase{
        font-size:16px;

        letter-spacing:0;
      }


      .top-logo{
        width:112px;
      }


      .whatsapp-button{
        width:70px;

        height:70px;
      }

    }


    @media(prefers-reduced-motion:reduce){

      .gold-sparkles,
      .whatsapp-button,
      .whatsapp-button::before,
      .whatsapp-button::after,
      .scroll-line{
        animation:none;
      }

    }

  </style>

</head>


<body>


  <main>


    <section
      class="hero"
      id="inicio"
    >


      <!-- NOVA FOTO DE FUNDO -->

      <img
        class="hero-background"

        src="6B987C82-0128-4805-9284-58DB898A5D27.jpeg"

        alt="Yara Nicácio e Nail Art"
      >


      <!-- DEGRADÊ PARA O PRETO -->

      <div
        class="bottom-fade"
        aria-hidden="true"
      ></div>


      <!-- BRILHOS -->

      <img
        class="gold-sparkles"
        id="goldSparkles"

        src="24CD378D-F11E-4CB2-B0FC-FCAFBE91B276.png"

        alt=""

        aria-hidden="true"
      >


      <!-- LOGOTIPO -->

      <img
        class="top-logo"
        id="topLogo"

        src="B246332E-6D6E-47D0-B3DD-02096818D8AD.png"

        alt="Yara Nicácio"
      >


      <!-- CONTEÚDO CENTRAL -->

      <div
        class="hero-content"
        id="heroContent"
      >


        <!-- YARA NICÁCIO -->

        <img
          class="name-image"

          src="C45E5C96-6A36-4BB4-B559-04CEAA03B6C2.png"

          alt="Yara Nicácio"
        >


        <!-- NAIL ARTISTIC -->

        <div class="nail-artistic-wrap">

          <img
            class="nail-artistic"

            src="AABE6DC3-4C34-4FDB-9157-B08BFC6D263D.png"

            alt="Nail Artistic"
          >

        </div>


        <!-- FRASE -->

        <p class="hero-phrase">
          O que você escolhe, vira arte em suas unhas
        </p>


        <div
          class="phrase-detail"
          aria-hidden="true"
        ></div>


      </div>


      <!-- DESLIZE -->

      <div class="scroll-indicator">

        <span>
          DESLIZE
        </span>

        <div class="scroll-line"></div>

      </div>


    </section>


    <!-- PRÓXIMA SEÇÃO -->

    <section class="next-section"></section>


  </main>


  <!-- WHATSAPP -->

  <a
    class="whatsapp-button"

    href="https://wa.me/5511932942455?text=Ol%C3%A1%2C%20gostaria%20de%20fazer%20as%20unhas%20com%20a%20Yara%20Nic%C3%A1cio%21%21%20%F0%9F%98%8A%F0%9F%92%85"

    target="_blank"

    rel="noopener noreferrer"

    aria-label="Falar com Yara Nicácio pelo WhatsApp"
  >

    <img
      src="0F16142F-FE3F-4FF5-B505-D1D0285A19CA.png"

      alt="WhatsApp"
    >

  </a>


  <!-- ========================================
       PROFUNDIDADE
       FUNDO PERMANECE FIXO
  ======================================== -->

  <script>

    const heroContent =
      document.getElementById("heroContent");

    const goldSparkles =
      document.getElementById("goldSparkles");

    const topLogo =
      document.getElementById("topLogo");


    let ticking = false;


    function updateDepth(){

      const scrollY =
        window.scrollY;


      /*
        FOTO:
        NÃO SE MOVE.
      */


      /*
        BRILHOS:
        CAMADA INTERMEDIÁRIA.
      */

      goldSparkles.style.transform =
        `translate3d(
          0,
          ${scrollY * 0.10}px,
          0
        )`;


      /*
        NOME + NAIL ARTISTIC + FRASE:
        CAMADA FRONTAL.
      */

      heroContent.style.transform =
        `translate3d(
          -50%,
          calc(
            -50% +
            ${scrollY * 0.18}px
          ),
          0
        )`;


      /*
        LOGOTIPO:
        CAMADA FRONTAL.
      */

      topLogo.style.transform =
        `translate3d(
          0,
          ${scrollY * 0.10}px,
          0
        )`;


      ticking = false;

    }


    window.addEventListener(

      "scroll",

      function(){

        if(!ticking){

          window.requestAnimationFrame(
            updateDepth
          );

          ticking = true;

        }

      },

      {
        passive:true
      }

    );

  </script>


</body>

</html>
