<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Yara Nicácio | Nail Artistic</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap"
    rel="stylesheet"
  >


  <style>

    /* ========================================
       CONFIGURAÇÕES GERAIS
    ======================================== */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;

      background:#050403;

      color:#ffffff;

      font-family:
        'Montserrat',
        sans-serif;

      overflow-x:hidden;
    }


    /* ========================================
       CAPA
    ======================================== */

    .hero{
      position:relative;

      width:100%;

      height:100svh;

      min-height:650px;

      overflow:hidden;

      background:#050403;

      isolation:isolate;
    }


    /* ========================================
       NOVA FOTO DE FUNDO
    ======================================== */

    .hero-bg{
      position:absolute;

      inset:-5% 0 0 0;

      width:100%;

      height:112%;

      object-fit:cover;

      object-position:center center;

      z-index:1;

      transform:
        translate3d(0,0,0)
        scale(1.045);

      will-change:transform;

      filter:
        brightness(.69)
        contrast(1.02)
        saturate(.92);
    }


    /* ========================================
       ESCURECIMENTO CINEMATOGRÁFICO
    ======================================== */

    .hero-overlay{
      position:absolute;

      inset:0;

      z-index:2;

      pointer-events:none;

      background:
        linear-gradient(
          to bottom,

          rgba(0,0,0,.26) 0%,

          rgba(0,0,0,.32) 28%,

          rgba(0,0,0,.44) 60%,

          rgba(0,0,0,.68) 82%,

          #050403 100%
        );
    }


    /* ========================================
       VINHETA
    ======================================== */

    .hero-vignette{
      position:absolute;

      inset:0;

      z-index:3;

      pointer-events:none;

      background:
        radial-gradient(
          ellipse at center,

          transparent 18%,

          rgba(0,0,0,.08) 46%,

          rgba(0,0,0,.48) 100%
        );
    }


    /* ========================================
       BRILHOS DOURADOS

       Ficam:
       - na frente da foto
       - atrás do nome
       - atrás da frase
       - atrás do logotipo
    ======================================== */

    .gold-sparkles{
      position:absolute;

      inset:-7%;

      z-index:4;

      pointer-events:none;

      will-change:transform;

      opacity:.64;

      mix-blend-mode:screen;

      filter:
        brightness(1.05)
        saturate(1.08);

      transform:
        translate3d(0,0,0)
        scale(1.08);
    }


    .gold-sparkles img{
      display:block;

      width:100%;

      height:100%;

      object-fit:cover;

      object-position:center;

      animation:
        sparkleBreath
        5s
        ease-in-out
        infinite;
    }


    /* ========================================
       LUZ ATRÁS DO NOME
    ======================================== */

    .center-light{
      position:absolute;

      left:50%;

      top:41%;

      transform:
        translate(-50%,-50%);

      width:100vw;

      max-width:900px;

      height:32vh;

      z-index:5;

      pointer-events:none;

      background:
        radial-gradient(
          ellipse at center,

          rgba(194,142,61,.13),

          rgba(151,102,37,.035) 42%,

          transparent 72%
        );

      filter:
        blur(27px);
    }


    /* ========================================
       LOGOTIPO SUPERIOR DIREITO
    ======================================== */

    .top-logo{
      position:absolute;

      top:
        calc(
          20px +
          env(safe-area-inset-top)
        );

      right:17px;

      z-index:8;

      width:92px;

      height:92px;

      display:flex;

      align-items:center;

      justify-content:center;

      opacity:.96;

      will-change:transform;

      filter:
        drop-shadow(
          0 8px 18px
          rgba(0,0,0,.70)
        );

      animation:
        logoEntrance
        1.4s
        ease
        forwards;
    }


    .top-logo img{
      display:block;

      width:100%;

      height:100%;

      object-fit:contain;
    }


    /* ========================================
       NOME + FRASE
    ======================================== */

    .hero-center{
      position:absolute;

      left:50%;

      top:40.5%;

      transform:
        translate3d(-50%,-50%,0);

      z-index:7;

      width:100%;

      display:flex;

      flex-direction:column;

      align-items:center;

      justify-content:center;

      text-align:center;

      padding:
        0 10px;

      will-change:transform;
    }


    /* ========================================
       YARA NICÁCIO
    ======================================== */

    .hero-name{
      position:relative;

      width:
        min(
          96vw,
          860px
        );

      opacity:0;

      filter:
        brightness(1.10)
        contrast(1.04)

        drop-shadow(
          0 5px 10px
          rgba(0,0,0,.88)
        )

        drop-shadow(
          0 18px 35px
          rgba(0,0,0,.70)
        )

        drop-shadow(
          0 0 15px
          rgba(186,126,38,.14)
        );

      animation:
        nameEntrance
        1.5s
        .12s
        ease
        forwards;
    }


    .hero-name img{
      display:block;

      width:100%;

      height:auto;
    }


    /* ========================================
       FRASE
    ======================================== */

    .hero-phrase{
      position:relative;

      margin-top:7px;

      width:96%;

      max-width:800px;

      white-space:nowrap;

      font-family:
        'Cormorant Garamond',
        serif;

      font-size:
        clamp(
          17px,
          3.7vw,
          23px
        );

      font-weight:400;

      line-height:1;

      letter-spacing:.6px;

      color:
        rgba(218,200,174,.62);

      text-shadow:
        0 3px 12px
        rgba(0,0,0,.90);

      opacity:0;

      animation:
        phraseEntrance
        1.4s
        .65s
        ease
        forwards;
    }


    /* ========================================
       DETALHE ABAIXO DA FRASE
    ======================================== */

    .phrase-line{
      width:34px;

      height:1px;

      margin-top:13px;

      background:
        linear-gradient(
          to right,

          transparent,

          rgba(211,161,78,.72),

          transparent
        );

      opacity:0;

      animation:
        fadeIn
        1.3s
        1s
        ease
        forwards;
    }


    /* ========================================
       DESLIZE
    ======================================== */

    .scroll-indicator{
      position:absolute;

      left:50%;

      bottom:
        calc(
          26px +
          env(safe-area-inset-bottom)
        );

      transform:
        translateX(-50%);

      z-index:9;

      display:flex;

      flex-direction:column;

      align-items:center;

      gap:8px;

      color:
        rgba(255,255,255,.30);

      font-size:8px;

      letter-spacing:3px;

      text-transform:uppercase;
    }


    .scroll-line{
      width:1px;

      height:32px;

      background:
        linear-gradient(
          to bottom,

          rgba(202,155,79,.80),

          transparent
        );

      transform-origin:top;

      animation:
        scrollLine
        1.8s
        infinite
        ease-in-out;
    }


    /* ========================================
       WHATSAPP
    ======================================== */

    .whatsapp{
      position:fixed;

      right:16px;

      bottom:
        calc(
          20px +
          env(safe-area-inset-bottom)
        );

      z-index:9999;

      width:62px;

      height:62px;

      display:flex;

      align-items:center;

      justify-content:center;

      border-radius:50%;

      text-decoration:none;

      transform-origin:center;

      animation:
        whatsappPulse
        1.7s
        infinite
        ease-in-out;

      filter:
        drop-shadow(
          0 9px 22px
          rgba(0,0,0,.70)
        );
    }


    .whatsapp img{
      display:block;

      width:100%;

      height:100%;

      object-fit:contain;

      pointer-events:none;
    }


    .whatsapp::before{
      content:"";

      position:absolute;

      inset:-5px;

      border-radius:50%;

      border:
        1px solid
        rgba(211,158,61,.60);

      animation:
        whatsappRing
        1.7s
        infinite
        ease-out;

      pointer-events:none;
    }


    .whatsapp::after{
      content:"";

      position:absolute;

      inset:-3px;

      border-radius:50%;

      border:
        1px solid
        rgba(211,158,61,.28);

      animation:
        whatsappRingTwo
        1.7s
        .35s
        infinite
        ease-out;

      pointer-events:none;
    }


    /* ========================================
       SEGUNDA SEÇÃO
    ======================================== */

    .intro{
      position:relative;

      min-height:70vh;

      display:flex;

      align-items:center;

      justify-content:center;

      padding:
        100px
        25px;

      text-align:center;

      background:
        linear-gradient(
          to bottom,

          #050403 0%,

          #080604 50%,

          #0a0805 100%
        );
    }


    .intro-content{
      max-width:600px;
    }


    .intro-small{
      display:block;

      margin-bottom:18px;

      color:#b78a4b;

      font-size:9px;

      letter-spacing:5px;

      text-transform:uppercase;
    }


    .intro h2{
      font-family:
        'Cormorant Garamond',
        serif;

      font-size:
        clamp(
          36px,
          9vw,
          62px
        );

      line-height:1.05;

      font-weight:400;

      color:#eee7dc;
    }


    /* ========================================
       ANIMAÇÕES
    ======================================== */

    @keyframes sparkleBreath{

      0%,
      100%{
        opacity:.78;

        transform:
          scale(1);
      }

      50%{
        opacity:1;

        transform:
          scale(1.015);
      }

    }


    @keyframes logoEntrance{

      from{
        opacity:0;

        transform:
          translateY(-14px)
          scale(.94);
      }

      to{
        opacity:.96;

        transform:
          translateY(0)
          scale(1);
      }

    }


    @keyframes nameEntrance{

      from{
        opacity:0;

        transform:
          translateY(26px)
          scale(.96);
      }

      to{
        opacity:1;

        transform:
          translateY(0)
          scale(1);
      }

    }


    @keyframes phraseEntrance{

      from{
        opacity:0;

        transform:
          translateY(12px);
      }

      to{
        opacity:1;

        transform:
          translateY(0);
      }

    }


    @keyframes fadeIn{

      from{
        opacity:0;
      }

      to{
        opacity:1;
      }

    }


    @keyframes scrollLine{

      0%,
      100%{
        opacity:.25;

        transform:
          scaleY(.65);
      }

      50%{
        opacity:1;

        transform:
          scaleY(1);
      }

    }


    @keyframes whatsappPulse{

      0%,
      100%{
        transform:
          scale(1);
      }

      50%{
        transform:
          scale(1.13);
      }

    }


    @keyframes whatsappRing{

      0%{
        opacity:.75;

        transform:
          scale(.85);
      }

      75%{
        opacity:0;

        transform:
          scale(1.42);
      }

      100%{
        opacity:0;

        transform:
          scale(1.42);
      }

    }


    @keyframes whatsappRingTwo{

      0%{
        opacity:.50;

        transform:
          scale(.90);
      }

      75%{
        opacity:0;

        transform:
          scale(1.30);
      }

      100%{
        opacity:0;

        transform:
          scale(1.30);
      }

    }


    /* ========================================
       CELULAR
    ======================================== */

    @media(max-width:600px){

      .hero{
        height:100svh;

        min-height:620px;
      }


      .hero-bg{
        object-position:
          center top;
      }


      .gold-sparkles{
        inset:-5% -12%;

        opacity:.62;
      }


      .top-logo{
        width:75px;

        height:75px;

        right:13px;

        top:
          calc(
            17px +
            env(safe-area-inset-top)
          );
      }


      /* NOME MAIS ALTO */

      .hero-center{
        top:40%;

        padding:
          0 7px;
      }


      /* NOME MAIOR */

      .hero-name{
        width:96vw;
      }


      /* FRASE MAIOR */

      .hero-phrase{
        width:97%;

        max-width:none;

        margin-top:6px;

        white-space:nowrap;

        font-size:
          clamp(
            14px,
            3.8vw,
            18px
          );

        letter-spacing:.25px;

        color:
          rgba(218,200,174,.60);
      }


      .phrase-line{
        margin-top:11px;
      }


      .whatsapp{
        width:59px;

        height:59px;

        right:15px;
      }

    }


    /* ========================================
       TELAS PEQUENAS
    ======================================== */

    @media(max-width:360px){

      .hero-name{
        width:95vw;
      }

      .hero-phrase{
        font-size:13px;

        letter-spacing:.1px;
      }

    }


    /* ========================================
       ACESSIBILIDADE
    ======================================== */

    @media(prefers-reduced-motion:reduce){

      *{
        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        scroll-behavior:auto !important;
      }

    }

  </style>

</head>


<body>


  <!-- ======================================
       CAPA
  ======================================= -->

  <section
    class="hero"
    id="hero"
  >


    <!-- NOVA CAPA -->

    <img
      class="hero-bg"
      id="heroBg"

      src="567E7566-6F98-4F5C-8C17-A00418788D50.png"

      alt="Yara Nicácio Nail Artistic"
    >


    <!-- ESCURECIMENTO -->

    <div class="hero-overlay"></div>


    <!-- VINHETA -->

    <div class="hero-vignette"></div>


    <!-- ====================================
         BRILHOS DOURADOS
    ===================================== -->

    <div
      class="gold-sparkles"
      id="goldSparkles"
    >

      <img
        src="24CD378D-F11E-4CB2-B0FC-FCAFBE91B276.png"

        alt=""
      >

    </div>


    <!-- LUZ CENTRAL -->

    <div class="center-light"></div>


    <!-- ====================================
         LOGOTIPO
    ===================================== -->

    <div
      class="top-logo"
      id="topLogo"
    >

      <img
        src="B246332E-6D6E-47D0-B3DD-02096818D8AD.png"

        alt="Logo Yara Nicácio"
      >

    </div>


    <!-- ====================================
         NOME + FRASE
    ===================================== -->

    <div
      class="hero-center"
      id="heroCenter"
    >


      <div class="hero-name">

        <img
          src="6F8DA6F0-A1F8-408E-89EB-F56A7A4E9896.png"

          alt="Yara Nicácio Nail Artistic"
        >

      </div>


      <p class="hero-phrase">
        O que você escolhe, vira arte em suas unhas
      </p>


      <div class="phrase-line"></div>


    </div>


    <!-- ====================================
         DESLIZE
    ===================================== -->

    <div class="scroll-indicator">

      Deslize

      <div class="scroll-line"></div>

    </div>


  </section>


  <!-- ======================================
       SEGUNDA SEÇÃO
  ======================================= -->

  <section class="intro">

    <div class="intro-content">

      <span class="intro-small">
        Yara Nicácio
      </span>

      <h2>
        Sofisticação presente<br>
        em cada detalhe.
      </h2>

    </div>

  </section>


  <!-- ======================================
       WHATSAPP
  ======================================= -->

  <a
    class="whatsapp"

    href="https://wa.me/5511932942455?text=Ol%C3%A1%2C%20gostaria%20de%20fazer%20as%20unhas%20com%20a%20Yara%20Nic%C3%A1cio%21%21%20%F0%9F%98%8A%F0%9F%92%85"

    target="_blank"

    rel="noopener noreferrer"

    aria-label="Agendar horário com Yara Nicácio pelo WhatsApp"
  >

    <img
      src="0F16142F-FE3F-4FF5-B505-D1D0285A19CA.png"

      alt="WhatsApp"
    >

  </a>


  <!-- ======================================
       PARALLAX / PROFUNDIDADE
  ======================================= -->

  <script>

    const hero =
      document.getElementById('hero');

    const heroBg =
      document.getElementById('heroBg');

    const goldSparkles =
      document.getElementById('goldSparkles');

    const heroCenter =
      document.getElementById('heroCenter');

    const topLogo =
      document.getElementById('topLogo');


    let ticking = false;


    function updateParallax(){

      const scrollY =
        window.scrollY;

      const heroHeight =
        hero.offsetHeight;


      if(scrollY <= heroHeight){


        /*
          PLANO 1
          FOTO DE FUNDO

          Movimento pequeno.
        */

        heroBg.style.transform =
          `translate3d(
            0,
            ${scrollY * 0.07}px,
            0
          )
          scale(1.045)`;


        /*
          PLANO 2
          BRILHOS

          Movimento intermediário.
          Isso faz os brilhos parecerem
          estar à frente da fotografia.
        */

        goldSparkles.style.transform =
          `translate3d(
            0,
            ${scrollY * 0.16}px,
            0
          )
          scale(1.08)`;


        /*
          PLANO 3
          NOME + FRASE

          Movimento maior para criar
          profundidade mais perceptível.
        */

        heroCenter.style.transform =
          `translate3d(
            -50%,
            calc(
              -50% +
              ${scrollY * 0.25}px
            ),
            0
          )`;


        /*
          LOGOTIPO

          Também fica no plano frontal,
          mas se movimenta um pouco menos
          que o nome.
        */

        topLogo.style.transform =
          `translate3d(
            0,
            ${scrollY * 0.18}px,
            0
          )`;

      }


      ticking = false;

    }


    window.addEventListener(

      'scroll',

      () => {

        if(!ticking){

          window.requestAnimationFrame(
            updateParallax
          );

          ticking = true;

        }

      },

      {
        passive:true
      }

    );


  </script>


</body>

</html>
