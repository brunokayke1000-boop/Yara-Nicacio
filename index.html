<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#050505">

  <title>Yara Nicácio | Nail Artistic</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
      background:#050505;
    }

    body{
      margin:0;
      background:#050505;
      color:#ffffff;
      overflow-x:hidden;
      font-family:'Montserrat',sans-serif;
    }

    body.menu-open{
      overflow:hidden;
    }


    /* ========================================
       CAPA
    ======================================== */

    .hero{
      position:relative;
      width:100%;
      height:100svh;
      min-height:680px;
      overflow:hidden;
      background:#050505;
      isolation:isolate;
    }


    .hero-background{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center center;
      z-index:0;
      filter:none;
      opacity:1;
      transform:none;
    }


    .bottom-fade{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:48%;
      z-index:1;
      pointer-events:none;

      background:
        linear-gradient(
          to bottom,
          rgba(5,5,5,0) 0%,
          rgba(5,5,5,.04) 18%,
          rgba(5,5,5,.13) 34%,
          rgba(5,5,5,.30) 52%,
          rgba(5,5,5,.58) 70%,
          rgba(5,5,5,.84) 86%,
          #050505 100%
        );
    }


    /* ========================================
       BRILHOS
    ======================================== */

    .gold-sparkles{
      position:absolute;
      inset:-3%;
      width:106%;
      height:106%;
      z-index:2;
      object-fit:cover;
      object-position:center;
      pointer-events:none;
      mix-blend-mode:screen;
      opacity:.19;

      animation:
        sparklePulse
        3s
        ease-in-out
        infinite;

      will-change:
        opacity,
        transform;
    }

    @keyframes sparklePulse{

      0%,
      100%{
        opacity:.13;
        transform:scale(1);
      }

      50%{
        opacity:.30;
        transform:scale(1.016);
      }

    }


    /* ========================================
       BOTÃO DO MENU
    ======================================== */

    .menu-trigger{
      position:absolute;

      top:
        max(
          24px,
          env(safe-area-inset-top)
        );

      left:16px;

      z-index:40;

      width:58px;
      height:58px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:50%;

      border:
        1px solid
        rgba(211,164,84,.68);

      background:
        rgba(5,5,5,.62);

      backdrop-filter:
        blur(8px);

      -webkit-backdrop-filter:
        blur(8px);

      box-shadow:
        0 6px 18px rgba(0,0,0,.45),
        0 0 14px rgba(211,164,84,.12),
        inset 0 0 12px rgba(211,164,84,.035);

      cursor:pointer;

      -webkit-tap-highlight-color:transparent;

      transition:
        transform .25s ease,
        background .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
    }


    .menu-trigger:active{
      transform:scale(.94);
    }


    .menu-icon{
      width:28px;
      height:21px;

      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }


    .menu-icon span{
      display:block;
      width:100%;
      height:2px;

      border-radius:10px;

      background:
        linear-gradient(
          90deg,
          #9f7334,
          #e4bf78,
          #a87531
        );

      box-shadow:
        0 0 5px rgba(226,187,110,.38);

      transition:
        transform .35s ease,
        opacity .35s ease;
    }


    body.menu-open .menu-trigger{
      background:
        rgba(8,7,5,.90);

      border-color:
        rgba(220,177,96,.82);

      box-shadow:
        0 6px 22px rgba(0,0,0,.60),
        0 0 18px rgba(211,164,84,.18);
    }


    body.menu-open .menu-icon span:nth-child(1){
      transform:
        translateY(9.5px)
        rotate(45deg);
    }

    body.menu-open .menu-icon span:nth-child(2){
      opacity:0;
    }

    body.menu-open .menu-icon span:nth-child(3){
      transform:
        translateY(-9.5px)
        rotate(-45deg);
    }


    /* ========================================
       FUNDO AO ABRIR MENU
    ======================================== */

    .menu-backdrop{
      position:fixed;
      inset:0;
      z-index:19;

      background:
        rgba(0,0,0,.58);

      backdrop-filter:
        blur(4px);

      -webkit-backdrop-filter:
        blur(4px);

      opacity:0;
      visibility:hidden;

      transition:
        opacity .45s ease,
        visibility .45s ease;
    }


    body.menu-open .menu-backdrop{
      opacity:1;
      visibility:visible;
    }


    /* ========================================
       PAINEL LATERAL
    ======================================== */

    .side-menu{
      position:fixed;
      top:0;
      left:0;

      width:min(84vw,390px);
      height:100svh;

      z-index:20;

      padding:
        max(
          115px,
          calc(
            env(safe-area-inset-top)
            + 95px
          )
        )
        30px
        45px;

      background:
        linear-gradient(
          145deg,
          rgba(8,7,5,.985),
          rgba(2,2,2,.99)
        );

      border-right:
        1px solid
        rgba(199,155,86,.18);

      box-shadow:
        20px 0 60px
        rgba(0,0,0,.45);

      transform:
        translateX(-102%);

      transition:
        transform
        .52s
        cubic-bezier(.22,.8,.25,1);

      display:flex;
      flex-direction:column;
    }


    body.menu-open .side-menu{
      transform:
        translateX(0);
    }


    .menu-eyebrow{
      color:#b58b50;

      font-family:
        'Cormorant Garamond',
        serif;

      font-size:13px;

      letter-spacing:4px;

      text-transform:uppercase;

      margin-bottom:11px;
    }


    .menu-title{
      font-family:
        'Cormorant Garamond',
        serif;

      font-size:38px;

      line-height:1;

      font-weight:500;

      color:#f1ece4;

      margin-bottom:52px;

      text-shadow:
        0 5px 14px rgba(0,0,0,.50);
    }


    /* ========================================
       LINKS DO MENU
    ======================================== */

    .menu-list{
      list-style:none;
      display:flex;
      flex-direction:column;
      gap:0;
    }


    .menu-list li{
      border-bottom:
        1px solid
        rgba(255,255,255,.08);
    }


    .menu-list a{
      position:relative;

      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:
        17px
        3px;

      color:
        rgba(255,255,255,.78);

      text-decoration:none;

      font-family:
        'Cormorant Garamond',
        serif;

      font-size:
        clamp(
          21px,
          6vw,
          27px
        );

      font-weight:400;

      transition:
        color .3s ease,
        padding-left .3s ease;
    }


    .menu-list a::after{
      content:"";

      width:24px;
      height:1px;

      background:
        rgba(199,155,86,.45);

      transition:
        width .3s ease,
        background .3s ease;
    }


    .menu-list a:hover{
      color:#d2aa6c;
      padding-left:8px;
    }


    .menu-list a:hover::after{
      width:36px;
      background:#c79b56;
    }


    .menu-footer{
      margin-top:auto;

      color:
        rgba(255,255,255,.27);

      font-size:8px;

      letter-spacing:3px;

      text-transform:uppercase;
    }


    /* ========================================
       LOGOTIPO SUPERIOR
    ======================================== */

    .top-logo{
      position:absolute;

      top:
        max(
          27px,
          env(safe-area-inset-top)
        );

      right:19px;

      width:125px;
      height:auto;

      object-fit:contain;

      z-index:5;

      filter:
        drop-shadow(
          0 5px 12px
          rgba(0,0,0,.70)
        )

        drop-shadow(
          0 0 7px
          rgba(207,159,67,.12)
        );

      will-change:transform;
    }


    /* ========================================
       CONTEÚDO
    ======================================== */

    .hero-content{
      position:absolute;
      top:50%;
      left:50%;
      width:min(96%,920px);

      transform:
        translate(-50%,-50%);

      z-index:4;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;

      will-change:transform;
    }


    .name-image{
      display:block;

      width:min(98vw,920px);
      max-width:100%;
      height:auto;

      object-fit:contain;

      margin:0 auto;

      filter:
        drop-shadow(
          0 7px 10px
          rgba(0,0,0,.90)
        )

        drop-shadow(
          0 16px 25px
          rgba(0,0,0,.72)
        )

        drop-shadow(
          0 0 7px
          rgba(255,255,255,.18)
        );
    }


    .nail-artistic-wrap{
      width:min(82vw,680px);
      margin-top:-15px;

      display:flex;
      align-items:center;
      justify-content:center;

      position:relative;
      z-index:2;
    }


    .nail-artistic{
      display:block;
      width:100%;
      height:auto;
      object-fit:contain;
      opacity:1;

      filter:
        brightness(1.8)
        saturate(.55)
        contrast(1.12)

        drop-shadow(
          0 3px 5px
          rgba(0,0,0,.90)
        )

        drop-shadow(
          0 0 6px
          rgba(255,221,150,.42)
        )

        drop-shadow(
          0 0 12px
          rgba(218,171,76,.22)
        );
    }


    .hero-phrase{
      margin-top:2px;
      width:100%;

      font-family:
        'Cormorant Garamond',
        Georgia,
        serif;

      font-size:
        clamp(
          20px,
          4.5vw,
          30px
        );

      font-weight:400;
      line-height:1.2;
      letter-spacing:.025em;

      color:
        rgba(245,233,211,.94);

      white-space:nowrap;
      text-align:center;

      text-shadow:
        0 3px 7px rgba(0,0,0,.95),
        0 8px 18px rgba(0,0,0,.82),
        0 0 8px rgba(209,166,87,.15);
    }


    .phrase-detail{
      width:48px;
      height:1px;
      margin-top:13px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(218,171,76,.85),
          transparent
        );

      box-shadow:
        0 0 7px
        rgba(218,171,76,.25);
    }


    /* ========================================
       DESLIZE
    ======================================== */

    .scroll-indicator{
      position:absolute;

      bottom:
        max(
          42px,
          calc(
            env(safe-area-inset-bottom)
            + 25px
          )
        );

      left:50%;

      transform:
        translateX(-50%);

      z-index:5;

      display:flex;
      flex-direction:column;
      align-items:center;

      gap:11px;

      pointer-events:none;
    }


    .scroll-indicator span{
      color:
        rgba(255,255,255,.34);

      font-size:10px;
      font-weight:400;
      letter-spacing:.42em;
      padding-left:.42em;
    }


    .scroll-line{
      width:1px;
      height:42px;

      background:
        linear-gradient(
          to bottom,
          rgba(202,154,67,.65),
          transparent
        );

      animation:
        scrollLine
        2.2s
        ease-in-out
        infinite;
    }


    @keyframes scrollLine{

      0%,
      100%{
        opacity:.25;
        transform:scaleY(.7);
        transform-origin:top;
      }

      50%{
        opacity:.85;
        transform:scaleY(1);
        transform-origin:top;
      }

    }


    /* ========================================
       WHATSAPP
    ======================================== */

    .whatsapp-button{
      position:fixed;

      right:18px;

      bottom:
        max(
          22px,
          calc(
            env(safe-area-inset-bottom)
            + 16px
          )
        );

      width:76px;
      height:76px;

      z-index:100;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:50%;

      text-decoration:none;

      animation:
        whatsappPulse
        3s
        ease-in-out
        infinite;

      -webkit-tap-highlight-color:transparent;
    }


    .whatsapp-button::before,
    .whatsapp-button::after{
      content:"";
      position:absolute;
      border-radius:50%;
      pointer-events:none;
    }


    .whatsapp-button::before{
      inset:-7px;

      border:
        1px solid
        rgba(214,167,73,.30);

      animation:
        whatsappRing
        3s
        ease-in-out
        infinite;
    }


    .whatsapp-button::after{
      inset:-16px;

      border:
        1px solid
        rgba(214,167,73,.12);

      animation:
        whatsappRingOuter
        3s
        ease-in-out
        infinite;
    }


    .whatsapp-button img{
      position:relative;
      width:100%;
      height:100%;
      object-fit:contain;
      z-index:2;

      filter:
        drop-shadow(
          0 5px 10px
          rgba(0,0,0,.85)
        )

        drop-shadow(
          0 0 7px
          rgba(214,167,73,.18)
        );
    }


    @keyframes whatsappPulse{

      0%,
      100%{
        transform:scale(1);
      }

      50%{
        transform:scale(1.075);
      }

    }


    @keyframes whatsappRing{

      0%,
      100%{
        opacity:.28;
        transform:scale(.94);
      }

      50%{
        opacity:.65;
        transform:scale(1.08);
      }

    }


    @keyframes whatsappRingOuter{

      0%,
      100%{
        opacity:.10;
        transform:scale(.92);
      }

      50%{
        opacity:.35;
        transform:scale(1.10);
      }

    }


    /* ========================================
       PRÓXIMA SEÇÃO
    ======================================== */

    .next-section{
      position:relative;

      min-height:70vh;

      background:
        linear-gradient(
          to bottom,
          #050505 0%,
          #070604 45%,
          #090705 100%
        );

      z-index:10;
    }


    /* ========================================
       MOBILE
    ======================================== */

    @media(max-width:600px){

      .hero{
        min-height:100svh;
      }


      .hero-background{
        object-position:center center;
      }


      .bottom-fade{
        height:52%;
      }


      .gold-sparkles{
        inset:-2%;

        width:104%;
        height:104%;

        opacity:.18;
      }


      .menu-trigger{
        top:
          max(
            22px,
            env(safe-area-inset-top)
          );

        left:15px;

        width:58px;
        height:58px;
      }


      .side-menu{
        width:84vw;
        max-width:360px;

        padding-left:27px;
        padding-right:27px;
      }


      .menu-title{
        font-size:38px;
        margin-bottom:50px;
      }


      .top-logo{
        width:125px;

        top:
          max(
            27px,
            env(safe-area-inset-top)
          );

        right:19px;
      }


      .hero-content{
        top:50.5%;
        width:97%;
      }


      .name-image{
        width:98vw;
      }


      .nail-artistic-wrap{
        width:83vw;
        margin-top:-17px;
      }


      .hero-phrase{
        margin-top:1px;

        font-size:
          clamp(
            18px,
            4.45vw,
            22px
          );

        letter-spacing:.01em;
        white-space:nowrap;
      }


      .whatsapp-button{
        width:76px;
        height:76px;
        right:18px;
      }

    }


    @media(max-width:390px){

      .hero-content{
        width:98%;
      }


      .name-image{
        width:98vw;
      }


      .nail-artistic-wrap{
        width:84vw;
        margin-top:-15px;
      }


      .hero-phrase{
        font-size:16px;
        letter-spacing:0;
      }


      .top-logo{
        width:112px;
      }


      .whatsapp-button{
        width:70px;
        height:70px;
      }

    }


    @media(prefers-reduced-motion:reduce){

      .gold-sparkles,
      .whatsapp-button,
      .whatsapp-button::before,
      .whatsapp-button::after,
      .scroll-line{
        animation:none;
      }

    }

  </style>

</head>


<body>


  <!-- FUNDO DO MENU -->

  <div
    class="menu-backdrop"
    id="menuBackdrop"
  ></div>


  <!-- MENU LATERAL -->

  <nav
    class="side-menu"
    id="sideMenu"
    aria-label="Menu principal"
  >

    <div class="menu-eyebrow">
      Yara Nicácio
    </div>

    <div class="menu-title">
      Menu
    </div>


    <ul class="menu-list">

      <li>
        <a href="trabalhos.html">
          Trabalhos
        </a>
      </li>

      <li>
        <a href="#" class="future-link">
          O estúdio
        </a>
      </li>

      <li>
        <a href="#" class="future-link">
          Yara Nicácio
        </a>
      </li>

      <li>
        <a href="#" class="future-link">
          Tabela de preços
        </a>
      </li>

      <li>
        <a href="#" class="future-link">
          Avaliações
        </a>
      </li>

      <li>
        <a href="#" class="future-link">
          Endereço
        </a>
      </li>

    </ul>


    <div class="menu-footer">
      Nail Artistic
    </div>

  </nav>


  <main>


    <section
      class="hero"
      id="inicio"
    >


      <!-- BOTÃO MENU -->

      <button
        class="menu-trigger"
        id="menuTrigger"
        aria-label="Abrir menu"
        aria-expanded="false"
      >

        <span class="menu-icon">

          <span></span>
          <span></span>
          <span></span>

        </span>

      </button>


      <!-- FOTO -->

      <img
        class="hero-background"
        src="6B987C82-0128-4805-9284-58DB898A5D27.jpeg"
        alt="Yara Nicácio e Nail Art"
      >


      <!-- DEGRADÊ -->

      <div
        class="bottom-fade"
        aria-hidden="true"
      ></div>


      <!-- BRILHOS -->

      <img
        class="gold-sparkles"
        id="goldSparkles"
        src="24CD378D-F11E-4CB2-B0FC-FCAFBE91B276.png"
        alt=""
        aria-hidden="true"
      >


      <!-- LOGO -->

      <img
        class="top-logo"
        id="topLogo"
        src="B246332E-6D6E-47D0-B3DD-02096818D8AD.png"
        alt="Yara Nicácio"
      >


      <!-- CONTEÚDO -->

      <div
        class="hero-content"
        id="heroContent"
      >

        <img
          class="name-image"
          src="C45E5C96-6A36-4BB4-B559-04CEAA03B6C2.png"
          alt="Yara Nicácio"
        >


        <div class="nail-artistic-wrap">

          <img
            class="nail-artistic"
            src="AABE6DC3-4C34-4FDB-9157-B08BFC6D263D.png"
            alt="Nail Artistic"
          >

        </div>


        <p class="hero-phrase">
          O que você escolhe, vira arte em suas unhas
        </p>


        <div
          class="phrase-detail"
          aria-hidden="true"
        ></div>

      </div>


      <!-- DESLIZE -->

      <div class="scroll-indicator">

        <span>
          DESLIZE
        </span>

        <div class="scroll-line"></div>

      </div>


    </section>


    <section class="next-section"></section>


  </main>


  <!-- WHATSAPP -->

  <a
    class="whatsapp-button"
    href="https://wa.me/5511932942455?text=Ol%C3%A1%2C%20gostaria%20de%20fazer%20as%20unhas%20com%20a%20Yara%20Nic%C3%A1cio%21%21%20%F0%9F%98%8A%F0%9F%92%85"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Falar com Yara Nicácio pelo WhatsApp"
  >

    <img
      src="0F16142F-FE3F-4FF5-B505-D1D0285A19CA.png"
      alt="WhatsApp"
    >

  </a>


  <script>

    /* ================================
       MENU
    ================================ */

    const menuTrigger =
      document.getElementById("menuTrigger");

    const menuBackdrop =
      document.getElementById("menuBackdrop");


    function toggleMenu(){

      const opened =
        document.body.classList.toggle(
          "menu-open"
        );

      menuTrigger.setAttribute(
        "aria-expanded",
        opened
      );

    }


    menuTrigger.addEventListener(
      "click",
      toggleMenu
    );


    menuBackdrop.addEventListener(
      "click",
      toggleMenu
    );


    /*
      SOMENTE OS LINKS QUE AINDA
      NÃO TÊM PÁGINA FICAM BLOQUEADOS
    */

    document
      .querySelectorAll(".future-link")
      .forEach(link => {

        link.addEventListener(
          "click",
          function(event){

            event.preventDefault();

          }
        );

      });


    /* ================================
       PROFUNDIDADE
    ================================ */

    const heroContent =
      document.getElementById("heroContent");

    const goldSparkles =
      document.getElementById("goldSparkles");

    const topLogo =
      document.getElementById("topLogo");


    let ticking = false;


    function updateDepth(){

      const scrollY =
        window.scrollY;


      goldSparkles.style.transform =
        `translate3d(
          0,
          ${scrollY * 0.10}px,
          0
        )`;


      heroContent.style.transform =
        `translate3d(
          -50%,
          calc(
            -50% +
            ${scrollY * 0.18}px
          ),
          0
        )`;


      topLogo.style.transform =
        `translate3d(
          0,
          ${scrollY * 0.10}px,
          0
        )`;


      ticking = false;

    }


    window.addEventListener(

      "scroll",

      function(){

        if(!ticking){

          window.requestAnimationFrame(
            updateDepth
          );

          ticking = true;

        }

      },

      {
        passive:true
      }

    );

  </script>


</body>

</html>
