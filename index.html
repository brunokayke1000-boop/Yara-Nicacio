<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#050505">

  <title>Yara Nicácio | Nail Artistic</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: #050505;
    }

    body {
      margin: 0;
      background: #050505;
      color: #ffffff;
      overflow-x: hidden;
      font-family: Georgia, "Times New Roman", serif;
    }

    /* ========================================
       CAPA
    ======================================== */

    .hero {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 680px;
      overflow: hidden;
      background: #050505;
      isolation: isolate;
    }

    /* FOTO PRINCIPAL
       Sem brightness, sem filtro e sem
       camada escura sobre a fotografia.
    */
    .hero-background {
      position: absolute;
      inset: 0;

      background-image:
        url("7D66BA8E-BFEA-40F3-968E-C63FEB764C0A.jpeg");

      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;

      z-index: 0;

      transform: scale(1.01);
      will-change: transform;
    }

    /*
      Vinheta extremamente leve.
      Não altera o tom geral da fotografia.
      Serve somente para acabamento nas bordas.
    */
    .hero-vignette {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0) 45%,
          rgba(0, 0, 0, 0.05) 72%,
          rgba(0, 0, 0, 0.13) 100%
        );
    }

    /* ========================================
       BRILHOS DOURADOS
    ======================================== */

    .gold-sparkles {
      position: absolute;
      inset: -3%;
      z-index: 2;

      width: 106%;
      height: 106%;

      object-fit: cover;
      object-position: center;

      pointer-events: none;

      /* Bem mais suave para não ofuscar */
      opacity: 0.18;

      mix-blend-mode: screen;

      animation: sparklePulse 3s ease-in-out infinite;

      will-change: opacity, transform;
    }

    @keyframes sparklePulse {
      0%,
      100% {
        opacity: 0.11;
        transform: scale(1);
      }

      50% {
        opacity: 0.24;
        transform: scale(1.012);
      }
    }

    /* ========================================
       LOGOTIPO SUPERIOR
    ======================================== */

    .top-logo {
      position: absolute;
      top: max(28px, env(safe-area-inset-top));
      right: 24px;

      width: clamp(105px, 24vw, 155px);
      height: auto;

      object-fit: contain;

      z-index: 5;

      filter:
        drop-shadow(0 5px 12px rgba(0, 0, 0, 0.7))
        drop-shadow(0 0 8px rgba(207, 159, 67, 0.12));

      will-change: transform;
    }

    /* ========================================
       CONTEÚDO CENTRAL
    ======================================== */

    .hero-content {
      position: absolute;

      top: 43%;
      left: 50%;

      width: min(94%, 900px);

      transform: translate(-50%, -50%);

      z-index: 4;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      will-change: transform;
    }

    /* YARA NICÁCIO */

    .name-image {
      display: block;

      width: min(96vw, 880px);
      max-width: 100%;
      height: auto;

      object-fit: contain;

      filter:
        drop-shadow(0 7px 10px rgba(0, 0, 0, 0.9))
        drop-shadow(0 16px 25px rgba(0, 0, 0, 0.7))
        drop-shadow(0 0 7px rgba(255, 255, 255, 0.16));

      transform: translateZ(0);

      margin: 0 auto;
    }

    /* ========================================
       NAIL ARTISTIC
    ======================================== */

    .nail-artistic-wrap {
      position: relative;

      width: min(79vw, 650px);

      margin-top: 17px;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .nail-artistic {
      display: block;

      width: 100%;
      height: auto;

      object-fit: contain;

      /*
        Aumenta bastante a luminosidade do PNG
        e reduz o aspecto alaranjado.
      */
      filter:
        brightness(1.65)
        saturate(0.68)
        contrast(1.12)
        drop-shadow(0 3px 5px rgba(0, 0, 0, 0.9))
        drop-shadow(0 0 5px rgba(255, 214, 125, 0.35))
        drop-shadow(0 0 11px rgba(218, 171, 76, 0.20));

      opacity: 1;
    }

    /* ========================================
       FRASE
    ======================================== */

    .hero-phrase {
      position: relative;

      margin-top: 18px;

      width: 100%;

      font-family: Georgia, "Times New Roman", serif;

      font-size: clamp(18px, 4.1vw, 29px);
      font-weight: 400;

      line-height: 1.3;

      letter-spacing: 0.035em;

      color: rgba(244, 231, 207, 0.91);

      white-space: nowrap;

      text-align: center;

      text-shadow:
        0 3px 7px rgba(0, 0, 0, 0.95),
        0 8px 18px rgba(0, 0, 0, 0.8),
        0 0 8px rgba(209, 166, 87, 0.12);
    }

    /* Pequeno detalhe dourado abaixo */

    .phrase-detail {
      width: 48px;
      height: 1px;

      margin-top: 17px;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(218, 171, 76, 0.85),
        transparent
      );

      box-shadow: 0 0 7px rgba(218, 171, 76, 0.25);
    }

    /* ========================================
       DESLIZE
    ======================================== */

    .scroll-indicator {
      position: absolute;

      bottom: max(42px, calc(env(safe-area-inset-bottom) + 25px));
      left: 50%;

      transform: translateX(-50%);

      z-index: 5;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 11px;

      pointer-events: none;
    }

    .scroll-indicator span {
      font-family: Arial, Helvetica, sans-serif;

      color: rgba(255, 255, 255, 0.34);

      font-size: 10px;
      font-weight: 400;

      letter-spacing: 0.42em;

      padding-left: 0.42em;
    }

    .scroll-line {
      width: 1px;
      height: 42px;

      background: linear-gradient(
        to bottom,
        rgba(202, 154, 67, 0.65),
        transparent
      );

      animation: scrollLine 2.2s ease-in-out infinite;
    }

    @keyframes scrollLine {
      0%,
      100% {
        opacity: 0.25;
        transform: scaleY(0.7);
        transform-origin: top;
      }

      50% {
        opacity: 0.85;
        transform: scaleY(1);
        transform-origin: top;
      }
    }

    /* ========================================
       WHATSAPP
    ======================================== */

    .whatsapp-button {
      position: fixed;

      right: 20px;
      bottom: max(22px, calc(env(safe-area-inset-bottom) + 16px));

      width: 82px;
      height: 82px;

      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      text-decoration: none;

      animation: whatsappPulse 3s ease-in-out infinite;

      -webkit-tap-highlight-color: transparent;
    }

    .whatsapp-button::before,
    .whatsapp-button::after {
      content: "";

      position: absolute;

      border-radius: 50%;

      pointer-events: none;
    }

    .whatsapp-button::before {
      inset: -7px;

      border: 1px solid rgba(214, 167, 73, 0.30);

      animation: whatsappRing 3s ease-in-out infinite;
    }

    .whatsapp-button::after {
      inset: -16px;

      border: 1px solid rgba(214, 167, 73, 0.12);

      animation: whatsappRingOuter 3s ease-in-out infinite;
    }

    .whatsapp-button img {
      position: relative;

      width: 100%;
      height: 100%;

      object-fit: contain;

      z-index: 2;

      filter:
        drop-shadow(0 5px 10px rgba(0, 0, 0, 0.85))
        drop-shadow(0 0 7px rgba(214, 167, 73, 0.18));
    }

    @keyframes whatsappPulse {
      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.075);
      }
    }

    @keyframes whatsappRing {
      0%,
      100% {
        opacity: 0.28;
        transform: scale(0.94);
      }

      50% {
        opacity: 0.65;
        transform: scale(1.08);
      }
    }

    @keyframes whatsappRingOuter {
      0%,
      100% {
        opacity: 0.10;
        transform: scale(0.92);
      }

      50% {
        opacity: 0.35;
        transform: scale(1.10);
      }
    }

    /* ========================================
       ÁREA APÓS A CAPA
       temporária para permitir o efeito
       de profundidade ao rolar.
    ======================================== */

    .next-section {
      position: relative;

      min-height: 70vh;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(111, 76, 27, 0.10),
          transparent 38%
        ),
        #050505;

      z-index: 10;
    }

    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 600px) {

      .hero {
        min-height: 100svh;
      }

      .hero-background {
        background-position: center center;
      }

      .gold-sparkles {
        inset: -2%;

        width: 104%;
        height: 104%;

        opacity: 0.17;
      }

      .top-logo {
        top: max(27px, env(safe-area-inset-top));
        right: 19px;

        width: 125px;
      }

      .hero-content {
        top: 43%;

        width: 95%;
      }

      .name-image {
        width: 96vw;
      }

      .nail-artistic-wrap {
        width: 78vw;
        margin-top: 15px;
      }

      .hero-phrase {
        margin-top: 17px;

        font-size: clamp(17px, 4.15vw, 21px);

        letter-spacing: 0.015em;

        white-space: nowrap;
      }

      .phrase-detail {
        margin-top: 15px;
      }

      .whatsapp-button {
        width: 76px;
        height: 76px;

        right: 18px;
      }
    }

    /* Celulares muito estreitos */

    @media (max-width: 390px) {

      .hero-content {
        width: 97%;
      }

      .name-image {
        width: 97vw;
      }

      .nail-artistic-wrap {
        width: 80vw;
      }

      .hero-phrase {
        font-size: 15.5px;
        letter-spacing: 0;
      }

      .top-logo {
        width: 112px;
      }

      .whatsapp-button {
        width: 70px;
        height: 70px;
      }
    }

    /* Respeita acessibilidade */

    @media (prefers-reduced-motion: reduce) {

      .gold-sparkles,
      .whatsapp-button,
      .whatsapp-button::before,
      .whatsapp-button::after,
      .scroll-line {
        animation: none;
      }
    }

  </style>
</head>

<body>

  <main>

    <section class="hero" id="inicio">

      <!-- FOTO DE FUNDO -->
      <div
        class="hero-background"
        id="heroBackground"
        aria-hidden="true"
      ></div>

      <!-- VINHETA MUITO LEVE -->
      <div
        class="hero-vignette"
        aria-hidden="true"
      ></div>

      <!-- BRILHOS -->
      <img
        class="gold-sparkles"
        id="goldSparkles"
        src="24CD378D-F11E-4CB2-B0FC-FCAFBE91B276.png"
        alt=""
        aria-hidden="true"
      >

      <!-- LOGOTIPO -->
      <img
        class="top-logo"
        id="topLogo"
        src="B246332E-6D6E-47D0-B3DD-02096818D8AD.png"
        alt="Yara Nicácio"
      >

      <!-- CONTEÚDO CENTRAL -->
      <div
        class="hero-content"
        id="heroContent"
      >

        <!-- NOME -->
        <img
          class="name-image"
          src="C45E5C96-6A36-4BB4-B559-04CEAA03B6C2.png"
          alt="Yara Nicácio"
        >

        <!-- NAIL ARTISTIC -->
        <div class="nail-artistic-wrap">

          <img
            class="nail-artistic"
            src="AABE6DC3-4C34-4FDB-9157-B08BFC6D263D.png"
            alt="Nail Artistic"
          >

        </div>

        <!-- FRASE -->
        <p class="hero-phrase">
          O que você escolhe, vira arte em suas unhas
        </p>

        <div
          class="phrase-detail"
          aria-hidden="true"
        ></div>

      </div>

      <!-- DESLIZE -->
      <div class="scroll-indicator">

        <span>DESLIZE</span>

        <div class="scroll-line"></div>

      </div>

    </section>

    <!--
      Espaço para construirmos as próximas
      partes do site posteriormente.
    -->
    <section class="next-section"></section>

  </main>

  <!-- WHATSAPP -->
  <a
    class="whatsapp-button"
    href="https://wa.me/5511932942455?text=Ol%C3%A1%2C%20gostaria%20de%20fazer%20as%20unhas%20com%20a%20Yara%20Nic%C3%A1cio%21%21%20%F0%9F%98%8A%F0%9F%92%85"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Falar com Yara Nicácio pelo WhatsApp"
  >

    <img
      src="0F16142F-FE3F-4FF5-B505-D1D0285A19CA.png"
      alt="WhatsApp"
    >

  </a>

  <script>

    /*
      PROFUNDIDADE / PARALLAX

      O fundo se movimenta menos.
      Os brilhos se movimentam em outra velocidade.
      O nome e os elementos da frente se movimentam
      um pouco mais, criando separação visual.
    */

    const heroBackground = document.getElementById("heroBackground");
    const heroContent = document.getElementById("heroContent");
    const goldSparkles = document.getElementById("goldSparkles");
    const topLogo = document.getElementById("topLogo");

    let ticking = false;

    function updateParallax() {

      const scrollY = window.scrollY;

      /*
        Fundo quase fixo:
        deslocamento muito pequeno.
      */
      const backgroundMove = scrollY * 0.06;

      /*
        Brilhos ficam entre o fundo
        e o conteúdo principal.
      */
      const sparkleMove = scrollY * 0.12;

      /*
        Conteúdo frontal ganha mais profundidade.
      */
      const contentMove = scrollY * 0.19;

      const logoMove = scrollY * 0.10;

      heroBackground.style.transform =
        `translate3d(0, ${backgroundMove}px, 0) scale(1.01)`;

      goldSparkles.style.transform =
        `translate3d(0, ${sparkleMove}px, 0)`;

      heroContent.style.transform =
        `translate3d(-50%, calc(-50% + ${contentMove}px), 0)`;

      topLogo.style.transform =
        `translate3d(0, ${logoMove}px, 0)`;

      ticking = false;
    }

    window.addEventListener(
      "scroll",
      function () {

        if (!ticking) {

          window.requestAnimationFrame(updateParallax);

          ticking = true;
        }

      },
      { passive: true }
    );

  </script>

</body>
</html>
