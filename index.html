<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Yara Nicácio | Nail Artistic</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap"
    rel="stylesheet"
  >


  <style>

    /* ========================================
       CONFIGURAÇÕES GERAIS
    ======================================== */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      background:#050403;
      color:#ffffff;

      font-family:
        'Montserrat',
        sans-serif;

      overflow-x:hidden;
    }


    /* ========================================
       CAPA
    ======================================== */

    .hero{
      position:relative;

      width:100%;

      height:100svh;

      min-height:650px;

      overflow:hidden;

      background:#050403;

      isolation:isolate;
    }


    /* ========================================
       NOVA FOTO DE FUNDO
    ======================================== */

    .hero-bg{
      position:absolute;

      inset:-5% 0 0 0;

      width:100%;

      height:112%;

      object-fit:cover;

      object-position:center center;

      z-index:1;

      transform:
        translate3d(0,0,0)
        scale(1.045);

      will-change:transform;

      filter:
        brightness(.78)
        contrast(1.03)
        saturate(.92);
    }


    /* ========================================
       ESCURECIMENTO CINEMATOGRÁFICO
    ======================================== */

    .hero-overlay{
      position:absolute;

      inset:0;

      z-index:2;

      pointer-events:none;

      background:
        linear-gradient(
          to bottom,

          rgba(0,0,0,.18) 0%,

          rgba(0,0,0,.26) 30%,

          rgba(0,0,0,.38) 60%,

          rgba(0,0,0,.64) 82%,

          #050403 100%
        );
    }


    /* ========================================
       VINHETA
    ======================================== */

    .hero-vignette{
      position:absolute;

      inset:0;

      z-index:3;

      pointer-events:none;

      background:
        radial-gradient(
          ellipse at center,

          transparent 16%,

          rgba(0,0,0,.06) 44%,

          rgba(0,0,0,.44) 100%
        );
    }


    /* ========================================
       BRILHOS DOURADOS
    ======================================== */

    .gold-sparkles{
      position:absolute;

      inset:-8%;

      z-index:4;

      pointer-events:none;

      will-change:transform;

      opacity:.82;

      mix-blend-mode:screen;

      filter:
        brightness(1.35)
        saturate(1.18);

      transform:
        translate3d(0,0,0)
        scale(1.10);
    }


    .gold-sparkles img{
      display:block;

      width:100%;

      height:100%;

      object-fit:cover;

      object-position:center;

      animation:
        sparkleFade
        4.4s
        ease-in-out
        infinite;
    }


    /* ========================================
       LUZ ATRÁS DO NOME
    ======================================== */

    .center-light{
      position:absolute;

      left:50%;

      top:40%;

      transform:
        translate(-50%,-50%);

      width:100vw;

      max-width:950px;

      height:34vh;

      z-index:5;

      pointer-events:none;

      background:
        radial-gradient(
          ellipse at center,

          rgba(205,149,62,.16),

          rgba(166,110,35,.04) 44%,

          transparent 72%
        );

      filter:
        blur(28px);
    }


    /* ========================================
       LOGOTIPO SUPERIOR DIREITO
    ======================================== */

    .top-logo{
      position:absolute;

      top:
        calc(
          18px +
          env(safe-area-inset-top)
        );

      right:14px;

      z-index:8;

      width:108px;

      height:108px;

      display:flex;

      align-items:center;

      justify-content:center;

      opacity:.98;

      will-change:transform;

      filter:
        drop-shadow(
          0 8px 20px
          rgba(0,0,0,.72)
        );

      animation:
        logoEntrance
        1.4s
        ease
        forwards;
    }


    .top-logo img{
      display:block;

      width:100%;

      height:100%;

      object-fit:contain;
    }


    /* ========================================
       NOME + FRASE
    ======================================== */

    .hero-center{
      position:absolute;

      left:50%;

      top:39.5%;

      transform:
        translate3d(-50%,-50%,0);

      z-index:7;

      width:100%;

      display:flex;

      flex-direction:column;

      align-items:center;

      justify-content:center;

      text-align:center;

      padding:
        0 4px;

      will-change:transform;
    }


    /* ========================================
       YARA NICÁCIO
    ======================================== */

    .hero-name{
      position:relative;

      width:
        min(
          98vw,
          900px
        );

      opacity:0;

      filter:
        brightness(1.16)
        contrast(1.06)

        drop-shadow(
          0 5px 11px
          rgba(0,0,0,.90)
        )

        drop-shadow(
          0 20px 38px
          rgba(0,0,0,.72)
        )

        drop-shadow(
          0 0 18px
          rgba(193,132,40,.18)
        );

      animation:
        nameEntrance
        1.5s
        .12s
        ease
        forwards;
    }


    .hero-name img{
      display:block;

      width:100%;

      height:auto;
    }


    /* ========================================
       FRASE
    ======================================== */

    .hero-phrase{
      position:relative;

      margin-top:8px;

      width:97%;

      max-width:820px;

      white-space:nowrap;

      font-family:
        'Cormorant Garamond',
        serif;

      font-size:
        clamp(
          19px,
          4.1vw,
          26px
        );

      font-weight:400;

      line-height:1;

      letter-spacing:.55px;

      color:
        rgba(220,200,171,.66);

      text-shadow:
        0 3px 13px
        rgba(0,0,0,.92);

      opacity:0;

      animation:
        phraseEntrance
        1.4s
        .65s
        ease
        forwards;
    }


    /* ========================================
       DETALHE ABAIXO DA FRASE
    ======================================== */

    .phrase-line{
      width:36px;

      height:1px;

      margin-top:13px;

      background:
        linear-gradient(
          to right,

          transparent,

          rgba(217,166,80,.76),

          transparent
        );

      opacity:0;

      animation:
        fadeIn
        1.3s
        1s
        ease
        forwards;
    }


    /* ========================================
       DESLIZE
    ======================================== */

    .scroll-indicator{
      position:absolute;

      left:50%;

      bottom:
        calc(
          26px +
          env(safe-area-inset-bottom)
        );

      transform:
        translateX(-50%);

      z-index:9;

      display:flex;

      flex-direction:column;

      align-items:center;

      gap:8px;

      color:
        rgba(255,255,255,.30);

      font-size:8px;

      letter-spacing:3px;

      text-transform:uppercase;
    }


    .scroll-line{
      width:1px;

      height:32px;

      background:
        linear-gradient(
          to bottom,

          rgba(202,155,79,.80),

          transparent
        );

      transform-origin:top;

      animation:
        scrollLine
        1.8s
        infinite
        ease-in-out;
    }


    /* ========================================
       WHATSAPP
    ======================================== */

    .whatsapp{
      position:fixed;

      right:16px;

      bottom:
        calc(
          20px +
          env(safe-area-inset-bottom)
        );

      z-index:9999;

      width:62px;

      height:62px;

      display:flex;

      align-items:center;

      justify-content:center;

      border-radius:50%;

      text-decoration:none;

      transform-origin:center;

      animation:
        whatsappPulse
        1.7s
        infinite
        ease-in-out;

      filter:
        drop-shadow(
          0 9px 22px
          rgba(0,0,0,.70)
        );
    }


    .whatsapp img{
      display:block;

      width:100%;

      height:100%;

      object-fit:contain;

      pointer-events:none;
    }


    .whatsapp::before{
      content:"";

      position:absolute;

      inset:-5px;

      border-radius:50%;

      border:
        1px solid
        rgba(211,158,61,.60);

      animation:
        whatsappRing
        1.7s
        infinite
        ease-out;

      pointer-events:none;
    }


    .whatsapp::after{
      content:"";

      position:absolute;

      inset:-3px;

      border-radius:50%;

      border:
        1px solid
        rgba(211,158,61,.28);

      animation:
        whatsappRingTwo
        1.7s
        .35s
        infinite
        ease-out;

      pointer-events:none;
    }


    /* ========================================
       SEGUNDA SEÇÃO
    ======================================== */

    .intro{
      position:relative;

      min-height:70vh;

      display:flex;

      align-items:center;

      justify-content:center;

      padding:
        100px
        25px;

      text-align:center;

      background:
        linear-gradient(
          to bottom,

          #050403 0%,

          #080604 50%,

          #0a0805 100%
        );
    }


    .intro-content{
      max-width:600px;
    }


    .intro-small{
      display:block;

      margin-bottom:18px;

      color:#b78a4b;

      font-size:9px;

      letter-spacing:5px;

      text-transform:uppercase;
    }


    .intro h2{
      font-family:
        'Cormorant Garamond',
        serif;

      font-size:
        clamp(
          36px,
          9vw,
          62px
        );

      line-height:1.05;

      font-weight:400;

      color:#eee7dc;
    }


    /* ========================================
       ANIMAÇÕES
    ======================================== */

    @keyframes sparkleFade{

      0%{
        opacity:.28;

        transform:
          scale(.985);
      }

      25%{
        opacity:.82;

        transform:
          scale(1);
      }

      50%{
        opacity:1;

        transform:
          scale(1.018);
      }

      75%{
        opacity:.70;

        transform:
          scale(1.005);
      }

      100%{
        opacity:.28;

        transform:
          scale(.985);
      }

    }


    @keyframes logoEntrance{

      from{
        opacity:0;

        transform:
          translateY(-14px)
          scale(.94);
      }

      to{
        opacity:.98;

        transform:
          translateY(0)
          scale(1);
      }

    }


    @keyframes nameEntrance{

      from{
        opacity:0;

        transform:
          translateY(26px)
          scale(.96);
      }

      to{
        opacity:1;

        transform:
          translateY(0)
          scale(1);
      }

    }


    @keyframes phraseEntrance{

      from{
        opacity:0;

        transform:
          translateY(12px);
      }

      to{
        opacity:1;

        transform:
          translateY(0);
      }

    }


    @keyframes fadeIn{

      from{
        opacity:0;
      }

      to{
        opacity:1;
      }

    }


    @keyframes scrollLine{

      0%,
      100%{
        opacity:.25;

        transform:
          scaleY(.65);
      }

      50%{
        opacity:1;

        transform:
          scaleY(1);
      }

    }


    @keyframes whatsappPulse{

      0%,
      100%{
        transform:
          scale(1);
      }

      50%{
        transform:
          scale(1.13);
      }

    }


    @keyframes whatsappRing{

      0%{
        opacity:.75;

        transform:
          scale(.85);
      }

      75%{
        opacity:0;

        transform:
          scale(1.42);
      }

      100%{
        opacity:0;

        transform:
          scale(1.42);
      }

    }


    @keyframes whatsappRingTwo{

      0%{
        opacity:.50;

        transform:
          scale(.90);
      }

      75%{
        opacity:0;

        transform:
          scale(1.30);
      }

      100%{
        opacity:0;

        transform:
          scale(1.30);
      }

    }


    /* ========================================
       CELULAR
    ======================================== */

    @media(max-width:600px){

      .hero{
        height:100svh;

        min-height:620px;
      }


      .hero-bg{
        object-position:
          center top;
      }


      .gold-sparkles{
        inset:-6% -12%;

        opacity:.90;

        filter:
          brightness(1.42)
          saturate(1.20);
      }


      .top-logo{
        width:88px;

        height:88px;

        right:10px;

        top:
          calc(
            13px +
            env(safe-area-inset-top)
          );
      }


      .hero-center{
        top:39%;

        padding:
          0 2px;
      }


      .hero-name{
        width:98vw;
      }


      .hero-phrase{
        width:98%;

        max-width:none;

        margin-top:7px;

        white-space:nowrap;

        font-size:
          clamp(
            16px,
            4.25vw,
            20px
          );

        letter-spacing:.2px;

        color:
          rgba(220,200,171,.66);
      }


      .phrase-line{
        margin-top:11px;
      }


      .whatsapp{
        width:59px;

        height:59px;

        right:15px;
      }

    }


    /* ========================================
       TELAS PEQUENAS
    ======================================== */

    @media(max-width:360px){

      .hero-name{
        width:97vw;
      }

      .hero-phrase{
        font-size:14.5px;

        letter-spacing:.05px;
      }

      .top-logo{
        width:82px;
        height:82px;
      }

    }


    /* ========================================
       ACESSIBILIDADE
    ======================================== */

    @media(prefers-reduced-motion:reduce){

      *{
        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        scroll-behavior:auto !important;
      }

    }

  </style>

</head>


<body>


  <!-- ======================================
       CAPA
  ======================================= -->

  <section
    class="hero"
    id="hero"
  >


    <!-- NOVA CAPA -->

    <img
      class="hero-bg"
      id="heroBg"

      src="7D66BA8E-BFEA-40F3-968E-C63FEB764C0A.jpeg"

      alt="Yara Nicácio Nail Artistic"
    >


    <!-- ESCURECIMENTO -->

    <div class="hero-overlay"></div>


    <!-- VINHETA -->

    <div class="hero-vignette"></div>


    <!-- ====================================
         BRILHOS DOURADOS
    ===================================== -->

    <div
      class="gold-sparkles"
      id="goldSparkles"
    >

      <img
        src="24CD378D-F11E-4CB2-B0FC-FCAFBE91B276.png"

        alt=""
      >

    </div>


    <!-- LUZ CENTRAL -->

    <div class="center-light"></div>


    <!-- ====================================
         LOGOTIPO
    ===================================== -->

    <div
      class="top-logo"
      id="topLogo"
    >

      <img
        src="B246332E-6D6E-47D0-B3DD-02096818D8AD.png"

        alt="Logo Yara Nicácio"
      >

    </div>


    <!-- ====================================
         NOME + FRASE
    ===================================== -->

    <div
      class="hero-center"
      id="heroCenter"
    >


      <div class="hero-name">

        <img
          src="6F8DA6F0-A1F8-408E-89EB-F56A7A4E9896.png"

          alt="Yara Nicácio Nail Artistic"
        >

      </div>


      <p class="hero-phrase">
        O que você escolhe, vira arte em suas unhas
      </p>


      <div class="phrase-line"></div>


    </div>


    <!-- ====================================
         DESLIZE
    ===================================== -->

    <div class="scroll-indicator">

      Deslize

      <div class="scroll-line"></div>

    </div>


  </section>


  <!-- ======================================
       SEGUNDA SEÇÃO
  ======================================= -->

  <section class="intro">

    <div class="intro-content">

      <span class="intro-small">
        Yara Nicácio
      </span>

      <h2>
        Sofisticação presente<br>
        em cada detalhe.
      </h2>

    </div>

  </section>


  <!-- ======================================
       WHATSAPP
  ======================================= -->

  <a
    class="whatsapp"

    href="https://wa.me/5511932942455?text=Ol%C3%A1%2C%20gostaria%20de%20fazer%20as%20unhas%20com%20a%20Yara%20Nic%C3%A1cio%21%21%20%F0%9F%98%8A%F0%9F%92%85"

    target="_blank"

    rel="noopener noreferrer"

    aria-label="Agendar horário com Yara Nicácio pelo WhatsApp"
  >

    <img
      src="0F16142F-FE3F-4FF5-B505-D1D0285A19CA.png"

      alt="WhatsApp"
    >

  </a>


  <!-- ======================================
       PARALLAX / PROFUNDIDADE
  ======================================= -->

  <script>

    const hero =
      document.getElementById('hero');

    const heroBg =
      document.getElementById('heroBg');

    const goldSparkles =
      document.getElementById('goldSparkles');

    const heroCenter =
      document.getElementById('heroCenter');

    const topLogo =
      document.getElementById('topLogo');


    let ticking = false;


    function updateParallax(){

      const scrollY =
        window.scrollY;

      const heroHeight =
        hero.offsetHeight;


      if(scrollY <= heroHeight){


        /* FUNDO */

        heroBg.style.transform =
          `translate3d(
            0,
            ${scrollY * 0.06}px,
            0
          )
          scale(1.045)`;


        /* BRILHOS */

        goldSparkles.style.transform =
          `translate3d(
            0,
            ${scrollY * 0.19}px,
            0
          )
          scale(1.10)`;


        /* NOME + FRASE */

        heroCenter.style.transform =
          `translate3d(
            -50%,
            calc(
              -50% +
              ${scrollY * 0.30}px
            ),
            0
          )`;


        /* LOGOTIPO */

        topLogo.style.transform =
          `translate3d(
            0,
            ${scrollY * 0.21}px,
            0
          )`;

      }


      ticking = false;

    }


    window.addEventListener(

      'scroll',

      () => {

        if(!ticking){

          window.requestAnimationFrame(
            updateParallax
          );

          ticking = true;

        }

      },

      {
        passive:true
      }

    );


  </script>


</body>

</html>
